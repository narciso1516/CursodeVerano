function answer(b,t){if(!busy)return;[...$('ans').children].forEach(x=>x.disabled=1);let ok=t==cur.correct;if(ok){b.classList.add('ok');sc[pl]++;$('fb').textContent='🔥 ¡Correcto! +1 punto'}else{b.classList.add('no');[...$('ans').children].find(x=>x.textContent==cur.correct).classList.add('ok');$('fb').textContent='❌ Correcta: '+cur.correct}ui();setTimeout(()=>{busy=0;if(!rem.length)return end();pl=(pl+1)%3;$('spin').disabled=0;$('card').classList.add('hide');ui()},1600)}
