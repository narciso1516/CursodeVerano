<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evaluación: El mito de Narciso</title>
<style>
:root{--bg1:#f6f0ff;--bg2:#e8f7ff;--card:#fff;--ink:#243047;--accent:#6c4ccf;--accent2:#17a6a1;--good:#238b57;--bad:#c43e52;--soft:#efeaff;--border:#d8ddea}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}header{background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:0 14px 35px rgba(36,48,71,.10);text-align:center}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);color:var(--accent)}header p{margin:7px 0;line-height:1.5}.instructions{margin-top:14px;padding:12px 16px;background:var(--soft);border-radius:14px;font-size:15px}.question{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(36,48,71,.07)}.qtitle{font-weight:700;font-size:18px;line-height:1.4;margin-bottom:14px}.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-right:8px;color:#fff;background:var(--accent)}label.option{display:block;padding:12px 14px;border:2px solid #e6e7ef;border-radius:13px;margin:9px 0;cursor:pointer;background:#fff}input[type=radio]{margin-right:9px}.feedback{margin-top:10px;font-weight:700;min-height:22px}.correct{color:var(--good)}.incorrect{color:var(--bad)}.controls{text-align:center;margin:26px 0}button{border:none;border-radius:14px;padding:13px 20px;margin:6px;font-size:16px;font-weight:700;cursor:pointer}#gradeBtn{background:var(--accent);color:white}#resetBtn{background:var(--accent2);color:white}#result{display:none;background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(36,48,71,.1)}#score{font-size:32px;font-weight:800;color:var(--accent)}footer{text-align:center;margin-top:30px;font-size:13px;opacity:.72}
</style></head><body><div class="wrap"><header><h1>El mito de Narciso</h1><p><strong>Evaluación de comprensión lectora</strong></p><p>Nivel sugerido: 1.º de secundaria</p><div class="instructions">Lee cada pregunta y selecciona una opción. Al terminar, presiona <strong>Calificar examen</strong>.</div></header><form id="quiz"></form><div class="controls"><button id="gradeBtn" type="button">Calificar examen</button><button id="resetBtn" type="button">Reiniciar</button></div><div id="result"><div id="score"></div><p id="message"></p></div><footer>Actividad educativa — Comprensión lectora: El mito de Narciso</footer></div>
<script>
const data=[
["¿Por qué era conocido Narciso?",["Por su fuerza extraordinaria.","Por su gran belleza.","Por ser un gran guerrero.","Por saber hablar con los dioses."],1],
["¿Cómo trataba Narciso a las personas que se enamoraban de él?",["Las escuchaba con atención.","Se hacía amigo de todas.","Las rechazaba y despreciaba.","Les pedía ayuda."],2],
["¿Qué defecto caracterizaba a Narciso?",["El orgullo.","La timidez.","La tristeza.","La cobardía."],0],
["¿Quién decidió castigar a Narciso por su comportamiento?",["Zeus.","Atenea.","Apolo.","Némesis."],3],
["¿Qué encontró Narciso mientras caminaba por el bosque?",["Un templo abandonado.","Un estanque de agua tranquila.","Una estatua de mármol.","Una cueva oscura."],1],
["¿Qué vio Narciso cuando se inclinó sobre el agua?",["A un dios.","Una flor.","Su propio reflejo.","A otra persona escondida."],2],
["¿Qué ocurrió cuando Narciso intentó tocar la imagen del agua?",["El agua se movió y la imagen desapareció.","La imagen salió del estanque.","El estanque se secó.","Narciso cayó inmediatamente al agua."],0],
["¿Por qué Narciso no podía estar realmente con la persona que veía?",["Porque era un dios.","Porque vivía muy lejos.","Porque desaparecía durante el día.","Porque la imagen era su propio reflejo."],3],
["¿Qué hizo Narciso al quedar obsesionado con su reflejo?",["Regresó a su casa.","Permaneció junto al estanque y dejó de atender sus necesidades.","Buscó a Némesis para pedir perdón.","Se convirtió en rey."],1],
["Según la versión más conocida del mito, ¿cómo murió Narciso?",["En una batalla.","Ahogado accidentalmente.","Se consumió junto al agua por su obsesión.","Fue convertido en piedra."],2],
["¿Qué apareció en el lugar donde murió Narciso?",["Una flor llamada narciso.","Un árbol de olivo.","Una fuente de piedra.","Una estatua."],0],
["¿Qué significa, de manera general, la palabra “narcisismo”?",["Miedo a hablar con otras personas.","Amor por la naturaleza.","Deseo de convertirse en famoso.","Admiración excesiva hacia uno mismo."],3],
["¿Cuál de estas acciones representa mejor el problema de Narciso?",["Tener confianza en sus capacidades.","Valorarse tanto que deja de reconocer el valor de los demás.","Querer aprender cosas nuevas.","Sentirse orgulloso después de hacer algo bien."],1],
["¿Cuál es una enseñanza central del mito?",["Nunca debemos mirarnos en un espejo.","La belleza siempre provoca problemas.","El orgullo excesivo puede alejarnos de los demás y dañarnos.","Las personas hermosas deben vivir solas."],2],
["¿Qué diferencia existe entre autoestima y narcisismo según la moraleja del texto?",["La autoestima implica valorarse sin dejar de respetar a los demás; el narcisismo puede convertirse en admiración excesiva por uno mismo.","No existe ninguna diferencia.","El narcisismo siempre significa ser valiente.","La autoestima consiste en creer que uno es superior a todos."],0]
];
const quiz=document.getElementById('quiz');data.forEach((q,i)=>{const d=document.createElement('div');d.className='question';d.dataset.answer=q[2];d.innerHTML=`<div class="qtitle"><span class="num">${i+1}</span>${q[0]}</div>`+q[1].map((x,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${x}</label>`).join('')+'<div class="feedback"></div>';quiz.appendChild(d)});
const questions=[...document.querySelectorAll('.question')],result=document.getElementById('result'),score=document.getElementById('score'),message=document.getElementById('message');
document.getElementById('gradeBtn').onclick=()=>{let c=0,a=0;questions.forEach(q=>{let s=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!s){f.textContent='⚠️ Falta responder esta pregunta.';f.className='feedback incorrect';return}a++;if(+s.value===+q.dataset.answer){c++;f.textContent='✅ Correcto';f.className='feedback correct'}else{f.textContent='❌ Incorrecto. Revisa el texto y vuelve a pensar la respuesta.';f.className='feedback incorrect'}});result.style.display='block';if(a<15){score.textContent=`${a}/15 respondidas`;message.textContent='Completa todas las preguntas antes de terminar la evaluación.'}else{let p=Math.round(c/15*100);score.textContent=`${c} de 15 — ${p}%`;message.textContent=p>=90?'Excelente comprensión del mito de Narciso.':p>=80?'Muy buen trabajo. Comprendiste casi todos los elementos importantes.':p>=70?'Buen avance. Conviene repasar algunos detalles del texto.':p>=60?'Necesitas repasar el mito y volver a intentarlo.':'Lee nuevamente la historia de Narciso y realiza otro intento.'}result.scrollIntoView({behavior:'smooth'})};
document.getElementById('resetBtn').onclick=()=>{quiz.reset();questions.forEach(q=>q.querySelector('.feedback').textContent='');result.style.display='none';window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
