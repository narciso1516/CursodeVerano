<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8e7"><title>Mi Primer Piano 🎹</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff8e7,#e8f8ff);color:#24324a;min-height:100vh}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title h1{margin:0;font-size:clamp(22px,4vw,38px)}.title p{margin:3px 0;color:#667085}.stars{background:#fff;border:2px solid #ffe08a;border-radius:18px;padding:9px 15px;font-weight:800}.modes,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{font:inherit;cursor:pointer;border:0}.mode,.small{min-height:44px;padding:9px 14px;border-radius:14px;background:#fff;border:2px solid #dce4ef;font-weight:750}.mode.active{background:#dff5ff;border-color:#53bdea}.lesson{background:#fff;border-radius:20px;padding:12px 15px;box-shadow:0 5px 18px #2342 0}.status{display:flex;align-items:center;justify-content:space-between;gap:10px}.message{font-size:clamp(16px,2.3vw,22px);font-weight:800}.noteNow{font-size:clamp(22px,4vw,38px);font-weight:900;color:#7557c8}.sequence{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 10px;border-radius:999px;background:#f1f3f7;font-weight:800}.chip.now{background:#fff0a8;outline:3px solid #ffc83d}.chip.done{opacity:.4;text-decoration:line-through}.pianoWrap{overflow-x:auto;margin-top:10px;padding:4px 0 12px}.piano{position:relative;display:flex;min-width:720px;height:230px;user-select:none}.white{position:relative;flex:1;background:#fff;border:2px solid #9ca9ba;border-radius:0 0 13px 13px;margin-right:2px;padding-top:155px;text-align:center;font-weight:900;font-size:18px;box-shadow:0 7px 0 #d8dee8}.white span{display:block;font-size:12px;color:#667085}.white.hit,.white.target{transform:translateY(5px);box-shadow:0 2px 0 #b8c2cf}.white.target{background:#fff5b9;outline:4px solid #ffc93c;z-index:2}.white:nth-child(1){border-bottom:12px solid #ff8b8b}.white:nth-child(2){border-bottom:12px solid #ffbd70}.white:nth-child(3){border-bottom:12px solid #ffe56f}.white:nth-child(4){border-bottom:12px solid #8fdda0}.white:nth-child(5){border-bottom:12px solid #74d9e7}.white:nth-child(6){border-bottom:12px solid #85b9ff}.white:nth-child(7){border-bottom:12px solid #c49aef}.white:nth-child(8){border-bottom:12px solid #f29bc0}.report{display:none;background:#fff;border-radius:20px;padding:16px;margin-top:10px}.report.show{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f6f8fb;border-radius:14px;padding:10px;text-align:center}.metric b{display:block;font-size:24px}.bar{height:12px;background:#e9edf3;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#74c69d;width:0}.confetti{position:fixed;pointer-events:none;z-index:99;width:9px;height:14px;top:-20px;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:700px){.app{padding:8px}.grid{grid-template-columns:repeat(2,1fr)}.piano{height:190px;min-width:650px}.white{padding-top:120px}.title p{display:none}}@media(orientation:portrait) and (max-width:700px){.rotate{display:block}}@media(orientation:landscape){.rotate{display:none}}.rotate{text-align:center;background:#fff3cd;border-radius:12px;padding:6px;margin-bottom:6px;font-size:13px}</style></head><body><main class="app"><div class="rotate">📱 Para tocar mejor, gira tu celular a horizontal.</div><header class="top"><div class="title"><h1>🎹 Mi Primer Piano</h1><p>Escucha • reconoce • toca • aprende</p></div><div class="stars">⭐ <span id="stars">0</span></div></header><div class="modes"><button class="mode active" data-mode="free">🎹 Libre</button><button class="mode" data-mode="scale">👂 Escala</button><button class="mode" data-mode="find">🎧 Encuentra</button><button class="mode" data-mode="song">✨ Canción</button></div><section class="lesson"><div class="status"><div><div id="msg" class="message">Toca una tecla y escucha su sonido 🎵</div><div id="sequence" class="sequence"></div></div><div id="noteNow" class="noteNow">—</div></div><div class="actions"><button id="hear" class="small">🔊 Escuchar</button><button id="reportBtn" class="small">📊 Mi progreso</button><button id="reset" class="small">↻ Reiniciar</button></div></section><div class="pianoWrap"><div class="piano" id="piano"></div></div><section id="report" class="report"><h2>🌟 Reporte de mi práctica</h2><div class="grid"><div class="metric"><b id="rTouches">0</b>Notas tocadas</div><div class="metric"><b id="rCorrect">0</b>Aciertos</div><div class="metric"><b id="rAccuracy">0%</b>Precisión</div><div class="metric"><b id="rStars">0</b>Estrellas</div></div><p><strong>Progreso musical</strong></p><div class="bar"><i id="progress"></i></div><p id="feedback"></p></section></main><script>(()=>{const N=[['DO','C4',261.63],['RE','D4',293.66],['MI','E4',329.63],['FA','F4',349.23],['SOL','G4',392],['LA','A4',440],['SI','B4',493.88],['DO','C5',523.25]],SONG=[0,0,4,4,5,5,4,3,3,2,2,1,1,0];let ctx,mode='free',target=null,pos=0,touches=0,correct=0,stars=0;const $=s=>document.querySelector(s),piano=$('#piano'),msg=$('#msg'),now=$('#noteNow'),seq=$('#sequence');N.forEach((n,i)=>{let b=document.createElement('button');b.className='white';b.dataset.i=i;b.innerHTML=n[0]+'<span>'+n[1]+'</span>';b.addEventListener('click',()=>press(i));piano.appendChild(b)});const keys=[...document.querySelectorAll('.white')];function ac(){ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(i,d=.5){let c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=N[i][2];g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);keys[i].classList.add('hit');setTimeout(()=>keys[i].classList.remove('hit'),160);now.textContent=N[i][0]}function press(i){touches++;tone(i);if(mode==='find'){if(i===target){correct++;reward();msg.textContent='¡Excelente! Era '+N[i][0]+' ⭐';setTimeout(newFind,600)}else{msg.textContent='Casi. Escucha otra vez 👂';setTimeout(()=>tone(target),250)}}else if(mode==='song'){if(i===SONG[pos]){correct++;reward();pos++;renderSeq();if(pos===SONG.length){msg.textContent='🎉 ¡Terminaste la canción!';confetti(70);mode='free';clearTarget()}else{target=SONG[pos];showTarget();msg.textContent='¡Muy bien! Ahora '+N[target][0]}}else msg.textContent='Inténtalo otra vez: sigue la tecla iluminada ✨'}updateReport()}function reward(){stars++;$('#stars').textContent=stars;if(stars%5===0)confetti(30)}function clearTarget(){keys.forEach(k=>k.classList.remove('target'))}function showTarget(){clearTarget();keys[target]?.classList.add('target')}function newFind(){target=Math.floor(Math.random()*8);clearTarget();msg.textContent='🎧 Escucha: ¿qué nota es?';tone(target)}function playScale(){msg.textContent='Escucha la escala: DO RE MI FA SOL LA SI DO';N.forEach((_,i)=>setTimeout(()=>tone(i,.35),i*430))}function startSong(){mode='song';pos=0;target=SONG[0];showTarget();renderSeq();msg.textContent='🎵 Sigue la luz y toca '+N[target][0]}function renderSeq(){seq.innerHTML='';if(mode!=='song')return;SONG.forEach((x,i)=>{let s=document.createElement('span');s.className='chip '+(i<pos?'done':i===pos?'now':'');s.textContent=N[x][0];seq.appendChild(s)})}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;clearTarget();seq.innerHTML='';if(mode==='free')msg.textContent='Toca libremente y conoce las notas 🎹';if(mode==='scale')playScale();if(mode==='find')newFind();if(mode==='song')startSong()});$('#hear').onclick=()=>target!=null?tone(target):playScale();$('#reportBtn').onclick=()=>{$('#report').classList.toggle('show');updateReport()};$('#reset').onclick=()=>{mode='free';target=null;pos=0;touches=correct=stars=0;$('#stars').textContent=0;now.textContent='—';seq.innerHTML='';clearTarget();msg.textContent='¡Comencemos de nuevo! Toca una tecla 🎵';updateReport()};function updateReport(){let acc=touches?Math.round(correct/touches*100):0;$('#rTouches').textContent=touches;$('#rCorrect').textContent=correct;$('#rAccuracy').textContent=acc+'%';$('#rStars').textContent=stars;$('#progress').style.width=Math.min(100,stars*4)+'%';$('#feedback').textContent=stars>=20?'🏆 ¡Excelente trabajo! Ya reconoces y sigues muchas notas.':stars>=10?'🌟 ¡Vas muy bien! Sigue practicando oído y secuencias.':'🎵 Sigue explorando las notas. Cada intento entrena tu oído musical.'}function confetti(n){const colors=['#ff7b7b','#ffd166','#70d6a5','#63c7e8','#a98be8','#f28bb5'];for(let i=0;i<n;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.5+'s';c.style.transform='rotate('+Math.random()*180+'deg)';document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}}updateReport()})();</script></body></html>
