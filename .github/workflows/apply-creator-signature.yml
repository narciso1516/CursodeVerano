name: Apply creator signature
on:
  push:
    paths:
      - 'tools/apply_creator_signature.py'
      - '.github/workflows/apply-creator-signature.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze and update educational HTML
        run: python tools/apply_creator_signature.py
      - name: Commit completed migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' AUTHOR_MIGRATION_REPORT.md
          git commit -m 'Standardize creator branding across educational pages'
          git push
