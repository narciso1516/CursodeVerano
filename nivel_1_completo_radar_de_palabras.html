<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivel 1 · Radar de Palabras</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fc;color:#26324a;display:grid;place-items:center;min-height:100vh}.load{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:24px;box-shadow:0 14px 34px rgba(38,50,74,.11);max-width:620px;margin:20px;text-align:center}.load b{display:block;font-size:1.2rem;margin-bottom:8px}.load a{display:inline-block;margin:6px;padding:10px 14px;border-radius:12px;background:#4B63B6;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="load" id="loading"><b>Cargando Nivel 1…</b><span>Preparando la navegación entre niveles.</span></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/narciso1516/CursodeVerano/ec155655b40f650bd78482153b40b7e9f4113213/nivel_1_completo_radar_de_palabras.html';
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar el nivel');
    let html=await r.text();
    const navCss=`
.level-navigation{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.level-navigation a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:13px;padding:11px 14px;font-weight:950;transition:.18s ease}
.level-navigation a:hover{transform:translateY(-2px)}
.level-navigation .nav-map{background:#EEF0F5;color:var(--ink);border:2px solid var(--line)}
.level-navigation .nav-next{background:var(--pear);color:#2A3200}
.level-navigation .nav-current{color:var(--muted);font-size:.84rem;font-weight:900}
@media(max-width:680px){.level-navigation{justify-content:center}.level-navigation .nav-current{width:100%;text-align:center;order:-1}}
`;
    html=html.replace('</style>',navCss+'</style>');
    const nav=`<nav class="level-navigation" aria-label="Navegación del curso"><a class="nav-map" href="index_ruta_mesoamericana_acentuacion_5to_mapa_ilustrado.html">← Volver al mapa</a><span class="nav-current">Nivel 1 · Radar de Palabras</span><a class="nav-next" href="nivel_2_laboratorio_de_silabas.html">Ir al Nivel 2 →</a></nav>`;
    html=html.replace('<section class="profile">',nav+'<section class="profile">');
    html=html.replace("onclick=\"alert('Nivel 1 completado. El siguiente paso es Nivel 2: separar palabras en sílabas.')\"","onclick=\"location.href='nivel_2_laboratorio_de_silabas.html'\"");
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<b>No se pudo cargar el nivel.</b><p>Usa uno de estos accesos:</p><a href="index_ruta_mesoamericana_acentuacion_5to_mapa_ilustrado.html">Volver al mapa</a><a href="nivel_2_laboratorio_de_silabas.html">Ir al Nivel 2</a>';
  }
})();
</script>
</body>
</html>
