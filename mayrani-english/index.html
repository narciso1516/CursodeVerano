 <div class="lesson-main"><div class="lesson-article"><section class="panel"><div class="eyebrow">Vamos desde el principio</div><h2 style="margin-top:9px">¿Qué aprenderás hoy?</h2><p>${l.lead}</p><div class="hintbox" style="margin-top:15px;border-color:#d9f2e9;background:#f6fdf9;padding:15px"><div class="hinticon mint-bg">🎯</div><div><strong>Meta de esta lección</strong><p>${escapeHtml(l.objective)}</p></div></div></section>
 <section class="panel"><div class="eyebrow">Tu explicación paso a paso</div><h2 style="margin-top:9px">Entiéndelo en 3 pasos</h2>${l.steps.map((s,i)=>`<div class="step-card"><span class="step-label">Paso ${i+1}</span><h3>${escapeHtml(s.title)}</h3><p>${s.text}</p></div>`).join('')}</section>
 <section class="panel"><div class="eyebrow">La regla visual</div><h2 style="margin-top:9px">Así se construye</h2><p>Lee los bloques de izquierda a derecha. Cada bloque cumple una función en la oración.</p>${l.formulas.map(formulaHtml).join('')}</section>
 <section class="panel"><div class="eyebrow">Frases reales</div><h2 style="margin-top:9px">Ejemplos con traducción</h2><p>Escucha cada frase con el botón de sonido y repítela en voz alta.</p><div class="example-list">${l.examples.map(([en,es])=>`<div class="example-row"><div><b lang="en">${escapeHtml(en)}</b><small>${escapeHtml(es)}</small></div><button class="play" data-speak="${escapeHtml(en)}" aria-label="Escuchar ${escapeHtml(en)}" title="Escuchar pronunciación">♪</button></div>`).join('')}</div><div class="alert"><b>Ojo con este error:</b> ${l.pitfall}</div></section>
 ${quizHtml('l'+id,l.questions)}
 <div class="lesson-footer"><button class="btn outline" data-route="${id===0?'home':'lesson'}" ${id===0?'':`data-lesson="${id-1}"`}>← ${id===0?'Mi inicio':'Lección anterior'}</button><button class="btn" data-route="${id===LESSONS.length-1?'exam':'lesson'}" ${id===LESSONS.length-1?'':`data-lesson="${id+1}"`}>${id===LESSONS.length-1?'Ir al examen final':'Siguiente lección'} →</button></div></div>
 <aside class="aside" aria-label="Información de la lección"><div class="aside-card"><span class="chip green">${escapeHtml(st.badge)}</span><h3 style="margin-top:15px">Tu guía de estudio</h3><ol><li>Lee cada paso.</li><li>Comprende las fórmulas.</li><li>Escucha y repite.</li><li>Resuelve el mini-reto.</li></ol><div class="small-divider"></div><p>⏱️ Tiempo sugerido: <b>${l.mins} min</b></p><p>📘 Tema de tus apuntes: <b>${escapeHtml(l.tag)}</b></p>${score>=70?`<div class="completion-box">✓ Lección completada · ${score}%</div>`:''}</div><div class="aside-card aside-highlight"><h3>✨ Una idea importante</h3><p>No necesitas memorizar todas las reglas al mismo tiempo. Aprende una estructura, úsala y después pasa a la siguiente.</p><button class="btn sm" data-route="lab">Practicar en el laboratorio →</button></div></aside></div>${pageFooter()}`;}
function labHtml(){return `<div class="simple-head"><div class="eyebrow">Laboratorio interactivo</div><h1>Construye tus propias oraciones ✎</h1><p>Elige un tiempo verbal, el tipo de oración, un pronombre y una acción. La frase se transforma automáticamente para que observes la regla.</p></div><div class="lab-intro"><strong>🧪 Una misma acción puede decir cosas diferentes</strong><p><b>I study</b> = Estudio (hábito). <b>I am studying</b> = Estoy estudiando (ahora). <b>I was studying</b> = Estaba estudiando (pasado).</p></div>
  <section class="panel"><h2>1. Selecciona los elementos</h2><div class="lab-grid"><div class="lab-field"><label for="lab-tense">TIEMPO VERBAL</label><select id="lab-tense"><option value="simple">Presente simple · rutina</option><option value="continuous">Presente continuo · ahora</option><option value="past">Pasado continuo · antes</option></select></div><div class="lab-field"><label for="lab-form">TIPO DE ORACIÓN</label><select id="lab-form"><option value="yes">Afirmativa ✓</option><option value="no">Negativa ✕</option><option value="ask">Interrogativa ?</option></select></div><div class="lab-field"><label for="lab-pronoun">PRONOMBRE</label><select id="lab-pronoun">${PRONOUNS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></div><div class="lab-field"><label for="lab-verb">VERBO</label><select id="lab-verb">${LAB_VERBS.map(v=>`<option value="${v[0]}">${v[0]} · ${v[3]}</option>`).join('')}</select></div></div><div class="lab-result" aria-live="polite"><div class="eyebrow">2. Observa tu resultado</div><h2 lang="en" id="lab-sentence">I study every day.</h2><p id="lab-meaning">Acción habitual / rutina.</p><div class="result-formula" id="lab-formula">Sujeto + verbo base + complemento</div><div class="lab-actions"><button class="btn gold sm" id="lab-audio">♪ Escuchar en inglés</button><button class="btn outline sm" id="lab-copy">⧉ Copiar mi oración</button></div></div></section>
  <div class="hintbox"><div class="hinticon">🧠</div><div><strong>Prueba estas 3 combinaciones</strong><p>1. She + study + presente simple + afirmativa. 2. They + read + presente continuo + pregunta. 3. I + work + pasado continuo + negativa. Observa qué cambia en cada una.</p></div></div>${pageFooter()}`;}
function glossaryHtml(){return `<div class="simple-head"><div class="eyebrow">Tu mini-diccionario</div><h1>Vocabulario para practicar 🔤</h1><p>Verbos, pronombres, expresiones de tiempo y auxiliares que aparecen en los apuntes. Puedes escucharlos y repasar con tarjetas.</p></div><section class="panel"><h2>Aprende con tarjetas</h2><p>Intenta recordar la traducción antes de descubrirla. Usa las flechas para cambiar de palabra.</p><div class="flash" id="flash"><div class="flash-category" id="flash-category">Verbos</div><div class="flash-word" id="flash-word">study</div><div class="flash-translation hide" id="flash-translation">estudiar</div></div><div class="flash-footer"><button class="btn outline sm" id="flash-prev">← Anterior</button><button class="btn sm" id="flash-reveal">Mostrar significado</button><button class="btn outline sm" id="flash-audio">♪ Escuchar</button><button class="btn outline sm" id="flash-next">Siguiente →</button></div><p class="tiny-note" style="text-align:center" id="flash-count"></p></section>
 <section class="panel"><h2>Diccionario con búsqueda</h2><div class="gloss-controls"><label class="sr-only" for="gloss-search">Buscar palabra</label><input class="search-input" id="gloss-search" type="search" placeholder="Busca: study, yesterday, ellos…"><button class="pill-button active" data-filter="Todos">Todos</button><button class="pill-button" data-filter="Pronombres">Pronombres</button><button class="pill-button" data-filter="Verbos">Verbos</button><button class="pill-button" data-filter="Tiempo">Tiempo</button><button class="pill-button" data-filter="Auxiliares">Auxiliares</button></div><div id="gloss-list" class="word-grid"></div></section>${pageFooter()}`;}
function examHtml(){return `<div class="exam-wrap"><div class="simple-head"><span class="chip orange">★ Desafío de preparatoria</span><h1>Examen final de Mayrani 🎓</h1><p>Un reto de ${FINAL_QUESTIONS.length} preguntas de los temas de su cuaderno: pronombres, presente simple, presente continuo y pasado continuo, más el puente al pasado simple. Obtén 70% o más para alcanzar el objetivo.</p></div><div class="hintbox" style="margin-bottom:19px"><div class="hinticon">🌟</div><div><strong>Antes de empezar</strong><p>No hay límite de tiempo. Puedes consultar tus lecciones y volver a intentar el examen. Tu mejor resultado se conservará en este navegador.</p></div></div>${quizHtml('final',FINAL_QUESTIONS)}</div>${pageFooter()}`;}
function normalize(s){return String(s??'').toLowerCase().trim().normalize('NFKC').replace(/[‘’]/g,"'").replace(/[^\p{L}\p{N}'\s]/gu,'').replace(/\s+/g,' ').trim();}
function saveScore(id,value){if(id==='final'){progress.final=Math.max(progress.final||0,value);}else{const n=Number(id.slice(1));progress.scores[n]=Math.max(progress.scores[n]||0,value);}store();}
function handleQuizSubmit(id){const questions=id==='final'?FINAL_QUESTIONS:LESSONS[Number(id.slice(1))]?.questions;if(!questions)return;const state=quizState[id]||(quizState[id]={answers:{},graded:false,score:0});if(state.graded)return;
  document.querySelectorAll('#quiz [data-question-input]').forEach(el=>{state.answers[Number(el.dataset.questionInput)]=el.value;});
  if(questions.some((q,i)=>state.answers[i]===undefined||String(state.answers[i]).trim()==='')){const missing=questions.findIndex((q,i)=>state.answers[i]===undefined||String(state.answers[i]).trim()==='');const el=document.getElementById('q-'+missing);if(el){el.style.borderColor='#e3a25e';el.scrollIntoView({behavior:'smooth',block:'center'});el.querySelector('input,button')?.focus();}return;}
  let count=0;questions.forEach((q,i)=>{const value=state.answers[i];if(q.type==='text'?q.accepted.some(t=>normalize(t)===normalize(value)):Number(value)===q.right)count++;});
  state.graded=true;state.score=Math.round(100*count/questions.length);saveScore(id,state.score);render();requestAnimationFrame(()=>{document.getElementById('quiz')?.scrollIntoView({block:'start',behavior:'smooth'});});
}
function render(){const route=routeFromHash();const map={home:'Mi inicio',lesson:LESSONS[route.id||0]?.title||'Lección',lab:'Laboratorio',glossary:'Vocabulario',exam:'Examen final'};document.getElementById('crumb').textContent=map[route.type];sidebarHtml(route);
  if(route.type==='lesson')app.innerHTML=lessonHtml(route.id);else if(route.type==='lab')app.innerHTML=labHtml();else if(route.type==='glossary')app.innerHTML=glossaryHtml();else if(route.type==='exam')app.innerHTML=examHtml();else app.innerHTML=renderHome();
  if(route.type==='lab')updateLab();if(route.type==='glossary'){renderFlash();updateGlossary();}
}
function speak(text){if(!('speechSynthesis' in window)){alert('Este navegador no ofrece lectura en voz alta. Puedes leer la frase y practicar su pronunciación.');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=1;const voices=speechSynthesis.getVoices();const enVoice=voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch{alert('No se pudo iniciar la pronunciación en este dispositivo.');}}
let labSentence='I study every day.';
function updateLab(){const tense=document.getElementById('lab-tense');if(!tense)return;const t=tense.value;const f=document.getElementById('lab-form').value;const p=document.getElementById('lab-pronoun').value;const verb=LAB_VERBS.find(v=>v[0]===document.getElementById('lab-verb').value)||LAB_VERBS[0];const third=['he','she','it'].includes(p);const is=p==='I'?'am':third?'is':'are';const was=['I','he','she','it'].includes(p)?'was':'were';const aux=third?'does':'do';const main=t==='simple'?(f==='yes'&&third?verb[1]:verb[0]):verb[2];const time=t==='simple'?'every day':t==='continuous'?'right now':'yesterday at 6 PM';let s,formula;
 if(t==='simple'){formula=f==='ask'?'Do/Does + sujeto + verbo base + ?':f==='no'?'Sujeto + don’t/doesn’t + verbo base':'Sujeto + verbo (+s con he/she/it)';s=f==='ask'?`${aux} ${p} ${verb[0]} ${time}?`:f==='no'?`${p} ${third?"doesn't":"don't"} ${verb[0]} ${time}.`:`${p} ${main} ${time}.`;}
 else{const tobe=t==='past'?was:is;formula=f==='ask'?'Was/Were o Am/Is/Are + sujeto + -ing + ?':f==='no'?'Sujeto + to be + not + verbo -ing':'Sujeto + to be + verbo -ing';s=f==='ask'?`${tobe} ${p} ${main} ${time}?`:f==='no'?`${p} ${tobe} not ${main} ${time}.`:`${p} ${tobe} ${main} ${time}.`;}
 labSentence=s.charAt(0).toUpperCase()+s.slice(1);document.getElementById('lab-sentence').textContent=labSentence;document.getElementById('lab-formula').textContent=formula;document.getElementById('lab-meaning').textContent=t==='simple'?'Presente simple: un hábito o acción habitual.':t==='continuous'?'Presente continuo: algo que sucede en este momento.':'Pasado continuo: algo que estaba pasando en un momento anterior.';}
let glossFilter='Todos',flashIndex=7,flashRevealed=false;
function renderFlash(){const item=GLOSSARY[flashIndex];const w=document.getElementById('flash-word');if(!w)return;document.getElementById('flash-category').textContent=item[2];w.textContent=item[0];const translation=document.getElementById('flash-translation');translation.textContent=item[1];translation.classList.toggle('hide',!flashRevealed);document.getElementById('flash-reveal').textContent=flashRevealed?'Ocultar significado':'Mostrar significado';document.getElementById('flash-count').textContent=`Tarjeta ${flashIndex+1} de ${GLOSSARY.length}`;}
function moveFlash(delta){flashIndex=(flashIndex+delta+GLOSSARY.length)%GLOSSARY.length;flashRevealed=false;renderFlash();}
function updateGlossary(){const el=document.getElementById('gloss-list');if(!el)return;const search=(document.getElementById('gloss-search').value||'').toLocaleLowerCase('es');const items=GLOSSARY.filter(([en,es,cat])=>(glossFilter==='Todos'||cat===glossFilter)&&(en.toLowerCase().includes(search)||es.toLocaleLowerCase('es').includes(search)));
  el.innerHTML=items.length?items.map(([en,es])=>`<div class="word-card"><div><b lang="en">${escapeHtml(en)}</b><small>${escapeHtml(es)}</small></div><button data-speak="${escapeHtml(en)}" title="Escuchar ${escapeHtml(en)}" aria-label="Escuchar ${escapeHtml(en)}">♪</button></div>`).join(''):'<div class="gloss-empty">No encontramos esa palabra. Prueba con otra.</div>';
  document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===glossFilter));}

document.addEventListener('click',e=>{
 const target=e.target.closest('button,[role="button"],.brand');if(!target)return;
 if(target.hasAttribute('data-route')){navigate(target.dataset.route,Number(target.dataset.lesson)||0);return;}
 if(target.hasAttribute('data-speak')){speak(target.dataset.speak);return;}
 if(target.hasAttribute('data-qid')){const route=routeFromHash();const id=route.type==='exam'?'final':'l'+route.id;const state=quizState[id]||(quizState[id]={answers:{},graded:false,score:0});if(!state.graded){const i=Number(target.dataset.qid);state.answers[i]=Number(target.dataset.option);const parent=target.closest('.options');parent.querySelectorAll('.option').forEach(x=>{const selected=x===target;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',String(selected));});}return;}
 if(target.hasAttribute('data-quiz-submit')){handleQuizSubmit(target.dataset.quizSubmit);return;}
 if(target.hasAttribute('data-quiz-retry')){delete quizState[target.dataset.quizRetry];render();requestAnimationFrame(()=>document.getElementById('quiz')?.scrollIntoView({block:'start',behavior:'smooth'}));return;}
 if(target.id==='lab-audio'){speak(labSentence);return;}
 if(target.id==='lab-copy'){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(labSentence).then(()=>{target.textContent='✓ Copiada';setTimeout(()=>{if(target.isConnected)target.textContent='⧉ Copiar mi oración';},1400);}).catch(()=>fallbackCopy(target));}else fallbackCopy(target);return;}
 if(target.id==='flash-next'){moveFlash(1);return;}
 if(target.id==='flash-prev'){moveFlash(-1);return;}
 if(target.id==='flash-reveal'){flashRevealed=!flashRevealed;renderFlash();return;}
 if(target.id==='flash-audio'){speak(GLOSSARY[flashIndex][0]);return;}
 if(target.hasAttribute('data-filter')){glossFilter=target.dataset.filter;updateGlossary();return;}
});
function fallbackCopy(button){const t=document.createElement('textarea');t.value=labSentence;t.style.position='fixed';t.style.top='-1000px';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch{}t.remove();button.textContent=ok?'✓ Copiada':'Selecciona el texto para copiar';}
document.addEventListener('change',e=>{if(e.target.matches('#lab-tense,#lab-form,#lab-pronoun,#lab-verb'))updateLab();});
document.addEventListener('input',e=>{if(e.target.id==='gloss-search')updateGlossary();});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.contains('open')?hideMenu():showMenu());
document.getElementById('overlay').addEventListener('click',hideMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideMenu();if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('brand')){e.preventDefault();navigate('home');}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
render();
</script>
</body>
</html>
