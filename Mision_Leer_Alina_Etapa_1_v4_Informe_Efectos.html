onido-letra"}, {"prompt": "¿Con qué letra empieza sol?", "options": ["T", "S", "L"], "answer": 1, "skill": "sonido-letra"}, {"prompt": "¿Con qué letra empieza luna?", "options": ["M", "L", "P"], "answer": 1, "skill": "sonido-letra"}, {"prompt": "¿Con qué letra empieza pato?", "options": ["T", "M", "P"], "answer": 2, "skill": "sonido-letra"}, {"prompt": "¿Con qué letra empieza taza?", "options": ["T", "P", "S"], "answer": 0, "skill": "sonido-letra"}, {"prompt": "Busca la misma letra: M", "options": ["N", "M", "S"], "answer": 1, "skill": "discriminación visual"}, {"prompt": "Busca la misma letra: S", "options": ["M", "S", "C"], "answer": 1, "skill": "discriminación visual"}, {"prompt": "Busca la misma letra: L", "options": ["T", "I", "L"], "answer": 2, "skill": "discriminación visual"}, {"prompt": "Busca la misma letra: P", "options": ["T", "R", "P"], "answer": 2, "skill": "discriminación visual"}, {"prompt": "Busca la misma letra: T", "options": ["T", "P", "L"], "answer": 0, "skill": "discriminación visual"}, {"prompt": "¿Qué sonido hace la M?", "options": ["/m/", "/l/", "/s/"], "answer": 0, "skill": "producción de sonido"}, {"prompt": "¿Qué sonido hace la S?", "options": ["/t/", "/s/", "/p/"], "answer": 1, "skill": "producción de sonido"}, {"prompt": "¿Qué sonido hace la L?", "options": ["/l/", "/m/", "/p/"], "answer": 0, "skill": "producción de sonido"}, {"prompt": "¿Qué sonido hace la P?", "options": ["/s/", "/l/", "/p/"], "answer": 2, "skill": "producción de sonido"}, {"prompt": "¿Qué sonido hace la T?", "options": ["/l/", "/m/", "/t/"], "answer": 2, "skill": "producción de sonido"}]}, {"title": "Bloque 3 · Construyo y leo", "subtitle": "Uno sonidos, leo sílabas y formo mis primeras palabras.", "questions": [{"prompt": "Junta los sonidos: /m/ + /a/. ¿Qué forman?", "options": ["me", "sa", "ma"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /m/ + /e/.", "options": ["me", "mi", "ma"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /m/ + /i/.", "options": ["mi", "mu", "me"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /m/ + /o/.", "options": ["mu", "ma", "mo"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /m/ + /u/.", "options": ["mi", "mu", "mo"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /s/ + /a/.", "options": ["se", "sa", "ma"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /s/ + /e/.", "options": ["se", "si", "sa"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /s/ + /i/.", "options": ["se", "si", "su"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /s/ + /o/.", "options": ["so", "sa", "su"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /s/ + /u/.", "options": ["si", "so", "su"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /l/ + /a/.", "options": ["le", "la", "ma"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /l/ + /e/.", "options": ["la", "le", "li"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /l/ + /i/.", "options": ["li", "le", "lu"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /l/ + /o/.", "options": ["lu", "la", "lo"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /l/ + /u/.", "options": ["lo", "li", "lu"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /p/ + /a/.", "options": ["ta", "pa", "pe"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /p/ + /e/.", "options": ["pa", "pe", "pi"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /p/ + /i/.", "options": ["pi", "pu", "pe"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /p/ + /o/.", "options": ["po", "pu", "pa"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /p/ + /u/.", "options": ["pi", "po", "pu"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /t/ + /a/.", "options": ["ta", "pa", "te"], "answer": 0, "skill": "fusión"}, {"prompt": "Junta: /t/ + /e/.", "options": ["ti", "ta", "te"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /t/ + /i/.", "options": ["tu", "ti", "te"], "answer": 1, "skill": "fusión"}, {"prompt": "Junta: /t/ + /o/.", "options": ["tu", "ta", "to"], "answer": 2, "skill": "fusión"}, {"prompt": "Junta: /t/ + /u/.", "options": ["tu", "ti", "to"], "answer": 0, "skill": "fusión"}, {"prompt": "Lee despacio: ma-pa. ¿Qué palabra formas?", "options": ["pama", "mapa", "mopa"], "answer": 1, "skill": "palabras"}, {"prompt": "Lee despacio: me-sa. ¿Qué palabra formas?", "options": ["suma", "mesa", "masa"], "answer": 1, "skill": "palabras"}, {"prompt": "Lee despacio: sa-po. ¿Qué palabra formas?", "options": ["sopa", "pasa", "sapo"], "answer": 2, "skill": "palabras"}, {"prompt": "Lee despacio: lu-pa. ¿Qué palabra formas?", "options": ["lupa", "pula", "loma"], "answer": 0, "skill": "palabras"}, {"prompt": "Lee despacio: pa-lo. ¿Qué palabra formas?", "options": ["pelo", "lupa", "palo"], "answer": 2, "skill": "palabras"}]}];

const app=document.getElementById('app');

function tokenize(text){
  return text.match(/\S+\s*/g) || [];
}
function renderWords(text){
  const words=tokenize(text);
  return words.map((w,i)=>`<span class="word" data-i="${i}">${escapeHTML(w)}</span>`).join('');
}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function speakKaraoke(text){
 speechSynthesis.cancel();
 const spans=[...document.querySelectorAll('.word')];
 spans.forEach(s=>s.className='word');
 const u=new SpeechSynthesisUtterance(text.replaceAll('/',''));
 u.lang='es-MX';u.rate=.70;u.pitch=1.02;
 let charStarts=[], acc=0;
 tokenize(text).forEach((w,i)=>{charStarts.push(acc);acc+=w.length});
 function activate(idx){
   spans.forEach((s,j)=>{
     if(j<idx) s.className='word revealed';
     else if(j===idx) s.className='word active';
     else s.className='word';
   });
 }
 u.onboundary=(e)=>{
   if(e.name!=='word') return;
   let idx=0;
   for(let i=0;i<charStarts.length;i++){ if(charStarts[i] <= e.charIndex) idx=i; else break; }
   activate(idx);
 };
 u.onend=()=>spans.forEach(s=>s.className='word revealed');
 speechSynthesis.speak(u);
}


function playSuccessSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ctx=new AC();
    const notes=[523.25,659.25,783.99,1046.5];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+i*.08);
      g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.08+.22);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.08);o.stop(ctx.currentTime+i*.08+.24);
    });
  }catch(e){}
}
function celebrate(){
  playSuccessSound();
  const fx=document.getElementById('fx');
  const icons=['✨','⭐','🌟','💫','🎉','📚'];
  for(let i=0;i<20;i++){
    const s=document.createElement('span');
    s.className='spark';s.textContent=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=(50+(Math.random()*14-7))+'vw';
    s.style.top=(45+(Math.random()*10-5))+'vh';
    s.style.setProperty('--dx',(Math.random()*420-210)+'px');
    s.style.setProperty('--dy',(Math.random()*360-240)+'px');
    fx.appendChild(s);setTimeout(()=>s.remove(),950);
  }
  document.querySelector('.card')?.classList.add('correct-pop');
  setTimeout(()=>document.querySelector('.card')?.classList.remove('correct-pop'),600);
}

function home(){
 app.innerHTML=`<section class="hero"><span class="badge">ETAPA 1 · RUTA PERSONAL</span><h1>Misión Leer, Alina ✨</h1>
 <p>Vamos a escuchar, descubrir sonidos y construir palabras paso a paso. <b>Las instrucciones no se leen solas:</b> Alina toca el botón 🔊 y las palabras se van iluminando mientras la voz las dice.</p>
 <div class="grid">${blocks.map((b,i)=>`<button class="block" onclick="start(${i})"><b>${b.title}</b><span>${b.subtitle}</span><span>30 retos · sin cronómetro</span></button>`).join('')}</div>
 <p class="note">Para el adulto: no leer la respuesta por Alina. Puede repetir el audio cuantas veces sea necesario.</p></section>`}
function start(i){bi=i;qi=0;attempts=0;errors=0;log=[];blockStart=Date.now();render()}
function render(){
 locked=false; let b=blocks[bi],q=b.questions[qi],pct=(qi/b.questions.length)*100;
 app.innerHTML=`<div class="top"><button class="home" onclick="home()">← Inicio</button><span class="pill">${qi+1} / ${b.questions.length}</span></div>
 <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 <div><b>${b.title}</b><div class="instruction">Toca el botón para escuchar:</div>
 <div class="karaoke" aria-live="polite">${renderWords(q.prompt)}</div>
 <button class="listen" onclick='speakKaraoke(${JSON.stringify(q.prompt)})'>🔊 Escuchar el reto</button>
 <div class="options">${q.options.map((o,i)=>`<button class="opt" onclick="answer(${i})"><small>${String.fromCharCode(65+i)})</small><br>${o}</button>`).join('')}</div>
 <div id="fb" class="feedback"></div><button id="next" class="next" onclick="next()">Siguiente reto →</button>
 <div class="teacher"><b>Habilidad:</b> ${q.skill}. <span id="attemptLabel">Intentos en este reto: 0</span></div></div>`;
}
function answer(i){
 if(locked)return; let q=blocks[bi].questions[qi],fb=document.getElementById('fb'); attempts++;
 document.getElementById('attemptLabel').textContent='Intentos en este reto: '+attempts;
 if(i===q.answer){
   locked=true; celebrate();
   fb.className='feedback ok';fb.style.display='block';
   const cheers=['¡Excelente, Alina! ✨','¡Lo descubriste! 🌟','¡Muy bien! 🎉','¡Cada vez lees mejor! 📚','¡Gran trabajo! ⭐'];
   fb.textContent=cheers[Math.floor(Math.random()*cheers.length)] + (attempts>1?' Lo lograste después de intentarlo.':'');
   document.getElementById('next').style.display='inline-block';
   log.push({number:qi+1,skill:q.skill,prompt:q.prompt,correct:true,attempts,firstTry:attempts===1});
 } else {
   errors++; fb.className='feedback try';fb.style.display='block';
   fb.textContent=attempts===1?'Escucha otra vez. Busca el sonido con calma.':'Vamos por partes. Escucha de nuevo y compara cada opción.';
 }
}
function next(){qi++;attempts=0;if(qi>=blocks[bi].questions.length)results();else render()}
function results(){
 let by={};log.forEach(x=>{by[x.skill]??={n:0,first:0,tries:0};by[x.skill].n++;by[x.skill].first+=x.attempts===1?1:0;by[x.skill].tries+=x.attempts});
 app.innerHTML=`<section class="results"><span class="badge">BLOQUE TERMINADO</span><h2>Reporte de aprendizaje de Alina</h2>
 <p>Este reporte prioriza habilidades, no velocidad. “Dominio inicial” se calcula con respuestas logradas al primer intento.</p>
 ${Object.entries(by).map(([k,v])=>{let p=Math.round(v.first/v.n*100);return `<div class="skillrow"><span>${k}</span><b>${p}%</b></div>`}).join('')}
 <div class="teacher"><b>Interpretación docente:</b> 85–100% = dominio inicial; 70–84% = consolidar; menos de 70% = volver a enseñar con modelado y ejemplos nuevos.</div>
 <button class="next" style="display:inline-block" onclick="home()">Volver a las misiones</button></section>`}
home();
</script></body></html>
