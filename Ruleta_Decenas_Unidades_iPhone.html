<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f05bb5">
<title>Ruleta Barbie - iPhone</title>
<style>
:root{
  --bg:#fff1fa;--card:#fffafd;--ink:#6b245e;--muted:#9b5b8d;
  --pink:#f05bb5;--pink2:#ff7fbd;--soft:#ffd3e9;--purple:#b86bd9;--green:#52c7a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff4fb,#ffe4f3);
  color:var(--ink);
}
main{
  max-width:430px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
}
.hero{text-align:center;padding:4px 4px 10px}
.hero h1{font-size:28px;line-height:1.05;margin:6px 0}
.hero p{font-size:15px;line-height:1.4;color:var(--muted);margin:8px 10px}
.card{
  background:rgba(255,250,253,.96);
  border:1.5px solid #f3b9dd;
  border-radius:24px;
  padding:16px;
  margin-top:12px;
}
.wheel-wrap{position:relative;width:min(72vw,270px);aspect-ratio:1;margin:8px auto 14px}
.pointer{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:30px;z-index:5;color:var(--purple)}
.wheel{
  width:100%;height:100%;border-radius:50%;
  border:10px solid #fff;
  box-shadow:0 0 0 4px #f4a6d4,0 10px 24px rgba(166,62,130,.14);
  display:grid;place-items:center;
  background:conic-gradient(#f05bb5 0 45deg,#ffd3e9 45deg 90deg,#b86bd9 90deg 135deg,#ff7fbd 135deg 180deg,#f05bb5 180deg 225deg,#ffd3e9 225deg 270deg,#b86bd9 270deg 315deg,#ff7fbd 315deg 360deg);
  transition:transform 4.5s cubic-bezier(.12,.72,.12,1);
}
.number{
  width:42%;aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  font-size:clamp(40px,12vw,56px);font-weight:900;
  background:#fff;border:6px solid #ffd3e9;box-shadow:0 5px 0 #ef9bcf;
  position:relative;z-index:2;
}
button{
  width:100%;min-height:52px;border:0;border-radius:16px;
  padding:14px 16px;font-size:17px;font-weight:800;
  cursor:pointer;background:var(--pink);color:white;
}
button:disabled{opacity:.48}
.secondary{background:var(--purple)}
.next{background:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{text-align:center;padding:13px;border-radius:18px;background:#fff0f8}
.box strong{font-size:14px}
input{
  width:100%;min-height:54px;font-size:30px;text-align:center;
  padding:10px;border:2px solid #e9a8d0;border-radius:14px;
  margin-top:8px;color:var(--ink);background:#fff;
}
input[type="text"]{font-size:19px;text-align:left}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#msg,#wordMsg{text-align:center;font-size:18px;line-height:1.35;font-weight:800;min-height:28px;margin-top:12px}
.blocks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ten{width:20px;height:58px;border-radius:6px;background:var(--pink);display:grid;place-items:center;color:#fff;font-size:10px}
.one{width:27px;height:27px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;color:#fff;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;padding:13px}
.stats div{background:#fff0f8;border-radius:16px;padding:10px 4px;font-size:12px}
.stats b{font-size:24px;display:block;margin-top:3px}
.write-stage{display:none;margin-top:14px;padding:14px;border-radius:18px;background:#fff0f8;border:2px dashed #e59bc9}
.write-stage h3{text-align:center;margin:0 0 6px;font-size:20px}
.word-hint{text-align:center;font-size:16px;font-weight:800;color:var(--purple);margin:6px 0 10px}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:370px){
  main{padding-left:10px;padding-right:10px}
  .grid,.actions{grid-template-columns:1fr}
  .wheel-wrap{width:min(78vw,250px)}
}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>🎀 Ruleta de números</h1>
    <p>Versión iPhone: gira, identifica decenas y unidades y escribe el número con letra.</p>
  </section>

  <section class="card">
    <div class="wheel-wrap">
      <div class="pointer">▼</div>
      <div id="wheel" class="wheel"><div id="num" class="number">24</div></div>
    </div>
    <button id="spin">🎡 Girar ruleta</button>
    <div class="note">La ruleta gira varios segundos antes de mostrar el número.</div>
  </section>

  <section class="card">
    <div class="grid">
      <div class="box">
        <strong>💗 DECENAS</strong>
        <input id="d" type="number" min="1" max="9" inputmode="numeric" placeholder="?">
      </div>
      <div class="box">
        <strong>💜 UNIDADES</strong>
        <input id="u" type="number" min="0" max="9" inputmode="numeric" placeholder="?">
      </div>
    </div>
    <div class="actions">
      <button id="check">✓ Comprobar</button>
      <button id="help" class="secondary">🧩 Ver fichas</button>
    </div>
    <div id="msg"></div>
    <div id="visual"></div>

    <div id="writeStage" class="write-stage">
      <h3>✍️ Escribe el número</h3>
      <div id="wordHint" class="word-hint"></div>
      <input id="wordInput" type="text" autocomplete="off" autocapitalize="none" placeholder="Ejemplo: veinticuatro">
      <div class="actions">
        <button id="checkWord">Comprobar</button>
        <button id="next" class="next" disabled>➡️ Siguiente</button>
      </div>
      <div id="wordMsg"></div>
    </div>
  </section>

  <section class="card stats">
    <div>Aciertos<b id="ok">0</b></div>
    <div>Intentos<b id="tries">0</b></div>
    <div>Racha<b id="streak">0</b></div>
  </section>
</main>

<script>
let n=24,ok=0,tries=0,streak=0,answered=false,rotation=0;
const $=x=>document.getElementById(x);

const words={
10:"diez",11:"once",12:"doce",13:"trece",14:"catorce",15:"quince",16:"dieciséis",17:"diecisiete",18:"dieciocho",19:"diecinueve",
20:"veinte",21:"veintiuno",22:"veintidós",23:"veintitrés",24:"veinticuatro",25:"veinticinco",26:"veintiséis",27:"veintisiete",28:"veintiocho",29:"veintinueve",
30:"treinta",31:"treinta y uno",32:"treinta y dos",33:"treinta y tres",34:"treinta y cuatro",35:"treinta y cinco",36:"treinta y seis",37:"treinta y siete",38:"treinta y ocho",39:"treinta y nueve",
40:"cuarenta",41:"cuarenta y uno",42:"cuarenta y dos",43:"cuarenta y tres",44:"cuarenta y cuatro",45:"cuarenta y cinco",46:"cuarenta y seis",47:"cuarenta y siete",48:"cuarenta y ocho",49:"cuarenta y nueve",
50:"cincuenta",51:"cincuenta y uno",52:"cincuenta y dos",53:"cincuenta y tres",54:"cincuenta y cuatro",55:"cincuenta y cinco",56:"cincuenta y seis",57:"cincuenta y siete",58:"cincuenta y ocho",59:"cincuenta y nueve",
60:"sesenta",61:"sesenta y uno",62:"sesenta y dos",63:"sesenta y tres",64:"sesenta y cuatro",65:"sesenta y cinco",66:"sesenta y seis",67:"sesenta y siete",68:"sesenta y ocho",69:"sesenta y nueve",
70:"setenta",71:"setenta y uno",72:"setenta y dos",73:"setenta y tres",74:"setenta y cuatro",75:"setenta y cinco",76:"setenta y seis",77:"setenta y siete",78:"setenta y ocho",79:"setenta y nueve",
80:"ochenta",81:"ochenta y uno",82:"ochenta y dos",83:"ochenta y tres",84:"ochenta y cuatro",85:"ochenta y cinco",86:"ochenta y seis",87:"ochenta y siete",88:"ochenta y ocho",89:"ochenta y nueve",
90:"noventa",91:"noventa y uno",92:"noventa y dos",93:"noventa y tres",94:"noventa y cuatro",95:"noventa y cinco",96:"noventa y seis",97:"noventa y siete",98:"noventa y ocho",99:"noventa y nueve"
};

function normalize(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
function prepareRound(){
  $("d").value="";$("u").value="";$("msg").textContent="";$("visual").innerHTML="";
  $("writeStage").style.display="none";$("wordInput").value="";$("wordMsg").textContent="";
  $("next").disabled=true;answered=false;
}
function spin(){
  $("spin").disabled=true;prepareRound();
  const target=Math.floor(Math.random()*90)+10;
  rotation+=(9+Math.floor(Math.random()*5))*360+Math.floor(Math.random()*360);
  $("wheel").style.transform=`rotate(${rotation}deg)`;
  $("msg").textContent="🎡 ¡Girando!";
  setTimeout(()=>{
    n=target;$("num").textContent=n;$("msg").textContent="✨ Ahora escribe sus decenas y unidades.";
    $("spin").disabled=false;$("d").focus();
  },4500);
}
function check(){
  if($("d").value===""||$("u").value===""){ $("msg").textContent="✏️ Completa los dos espacios.";return}
  if(answered){$("msg").textContent="✍️ Ahora escribe el nombre del número.";return}
  const d=Number($("d").value),u=Number($("u").value),cd=Math.floor(n/10),cu=n%10;
  tries++;
  if(d===cd&&u===cu){
    ok++;streak++;answered=true;
    $("msg").textContent=`🎉 ¡Correcto! ${n} = ${cd} decenas + ${cu} unidades.`;
    $("writeStage").style.display="block";
    $("wordHint").textContent=`¿Cómo se escribe ${n} con letra?`;
    $("wordInput").focus();
  }else{
    streak=0;$("msg").textContent=`💡 Revisa: ${n} tiene ${cd} decenas y ${cu} unidades.`;
  }
  $("ok").textContent=ok;$("tries").textContent=tries;$("streak").textContent=streak;
}
function checkWord(){
  const typed=normalize($("wordInput").value),correct=normalize(words[n]);
  if(!typed){$("wordMsg").textContent="✏️ Escribe el nombre del número.";return}
  if(typed===correct){
    $("wordMsg").textContent=`🌟 ¡Excelente! ${n} se escribe “${words[n]}”.`;
    $("next").disabled=false;
  }else{
    $("wordMsg").textContent="💗 Casi. Revísalo e inténtalo otra vez.";
    $("next").disabled=true;
  }
}
function help(){
  const d=Math.floor(n/10),u=n%10;
  $("visual").innerHTML=`<p style="text-align:center;font-weight:800">Así se forma ${n}:</p>
  <div class="blocks">${'<span class="ten">10</span>'.repeat(d)}</div>
  <div class="blocks">${'<span class="one">1</span>'.repeat(u)||'<span>0 unidades</span>'}</div>`;
}
$("spin").addEventListener("click",spin);
$("check").addEventListener("click",check);
$("help").addEventListener("click",help);
$("checkWord").addEventListener("click",checkWord);
$("next").addEventListener("click",spin);
</script>
</body>
</html>
