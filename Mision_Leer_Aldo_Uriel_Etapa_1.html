<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión Leer · Aldo Uriel · Etapa 1</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#dbeafe;color:#17324d}
  .loading{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#eff6ff 0,#dbeafe 42%,#ccfbf1 100%)}
  .loading-card{max-width:560px;background:#fff;border-radius:28px;padding:32px;text-align:center;box-shadow:0 20px 60px rgba(23,50,77,.14)}
  .loading-icon{font-size:54px}.loading h1{margin:10px 0 8px}.loading p{line-height:1.5;color:#52657a}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="loading-card">
    <div class="loading-icon">🚀📘</div>
    <h1>Preparando la misión de Aldo Uriel…</h1>
    <p>Cargando sus retos de lectura, sonidos y letras.</p>
  </div>
</div>
<script>
(async()=>{
  const source='Mision_Leer_Alina_Etapa_1_v4_Informe_Efectos.html';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la actividad base.');
    let html=await response.text();

    // Personalización de nombre sin alterar el banco de reactivos ni la lógica educativa.
    html=html.replaceAll('Alina','Aldo Uriel');

    // Paleta visual para Aldo Uriel: azul, turquesa, naranja y amarillo.
    html=html.replace(
      ':root{--ink:#24304a;--paper:#fffdf8;--lav:#ece6ff;--vio:#6b55c9;--mint:#dff7ed;--green:#32866b;--peach:#ffe3d3;--coral:#e87362;--sun:#ffe79b;--blue:#dff1ff}',
      ':root{--ink:#17324d;--paper:#f8fcff;--lav:#dbeafe;--vio:#2563eb;--mint:#ccfbf1;--green:#0f766e;--peach:#ffedd5;--coral:#f97316;--sun:#fde68a;--blue:#e0f2fe}'
    );

    // Refuerzo del estilo aventurero, manteniendo la misma estructura y funcionalidad.
    html=html.replace('</style>', `
.hero::before{content:'🚀  MISIÓN DE LECTURA  🧭';display:inline-block;margin-bottom:8px;padding:7px 12px;border-radius:999px;background:#e0f2fe;color:#0c4a6e;font-size:.82rem;font-weight:950;letter-spacing:.06em}
.card{border:2px solid rgba(37,99,235,.10)!important;box-shadow:0 18px 60px rgba(23,50,77,.14)!important}
.block{position:relative;overflow:hidden;border:2px solid rgba(23,50,77,.06)!important;transition:.2s ease}
.block:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(23,50,77,.12)}
.block:nth-child(1)::after{content:'🎧';position:absolute;right:15px;bottom:10px;font-size:38px;opacity:.28}
.block:nth-child(2)::after{content:'🔤';position:absolute;right:15px;bottom:10px;font-size:38px;opacity:.28}
.block:nth-child(3)::after{content:'📚';position:absolute;right:15px;bottom:10px;font-size:38px;opacity:.28}
.listen{background:linear-gradient(135deg,#2563eb,#0ea5e9)!important}
.next{background:linear-gradient(135deg,#17324d,#0f766e)!important}
.opt{box-shadow:0 5px 0 rgba(23,50,77,.06);transition:.15s ease}
.opt:active{transform:translateY(2px)}
.progress{background:#dbeafe!important}.bar{background:linear-gradient(90deg,#2563eb,#14b8a6,#f59e0b)!important}
@media(max-width:700px){.wrap{padding:10px!important}.card{border-radius:22px!important}.hero h1{font-size:clamp(2rem,12vw,3.3rem)!important}.opt{font-size:1.25rem!important}}
</style>`);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML=`<div class="loading-card"><div class="loading-icon">🛠️</div><h1>No pudimos abrir la misión</h1><p>${error.message}</p><p>Recarga la página para intentarlo de nuevo.</p></div>`;
  }
})();
</script>
</body>
</html>
