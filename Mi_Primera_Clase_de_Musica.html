<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Primera Clase de Música</title>
<style>
:root{--ink:#20304a;--paper:#fffdf7;--blue:#5aa9e6;--green:#7fc8a9;--yellow:#ffd166;--pink:#ef88b7;--red:#ff6b6b;--purple:#9b8afb}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf8ff,#fff6d8)}
button{font:inherit;color:inherit;cursor:pointer;border:0}.app{min-height:100svh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#ffffffd9;box-shadow:0 2px 12px #0001}.brand{font-weight:900;font-size:clamp(17px,2.6vw,27px);flex:1}.stars{font-weight:900}.progress{height:10px;background:#e7edf4;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));transition:.35s}main{flex:1;display:grid;place-items:center;padding:14px}.card{width:min(980px,100%);background:var(--paper);border-radius:26px;padding:clamp(14px,2.6vw,28px);box-shadow:0 14px 40px #29425b22;text-align:center;border:3px solid #fff}h1{margin:0 0 8px;font-size:clamp(25px,4vw,44px)}h2{margin:4px 0 10px;font-size:clamp(21px,3.2vw,34px)}p{font-size:clamp(15px,2vw,20px);margin:7px auto;max-width:760px}.big{font-size:clamp(42px,8vw,86px)}.row{display:flex;justify-content:center;align-items:stretch;gap:12px;flex-wrap:wrap;margin-top:15px}.choice,.action{padding:14px 22px;border-radius:18px;background:white;box-shadow:0 5px 0 #ccd6e2;border:2px solid #dbe4ed;font-weight:900;min-width:145px}.choice:active,.action:active,.key:active{transform:translateY(3px);box-shadow:0 2px 0 #ccd6e2}.primary{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 5px 0 #327db7}.good{background:#e8fff2}.bad{animation:shake .25s 2;background:#fff0f0}.piano{display:flex;justify-content:center;gap:7px;margin:18px auto 8px;width:min(900px,100%)}.key{flex:1;min-width:54px;max-width:105px;height:clamp(105px,25vh,190px);border-radius:0 0 16px 16px;background:#fff;border:2px solid #ccd6e2;box-shadow:0 7px 0 #b9c5d2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px 3px;font-weight:1000;font-size:clamp(14px,2vw,22px);transition:.08s}.key small{font-weight:700;opacity:.65}.key.lit{transform:translateY(3px);box-shadow:0 3px 0 #b9c5d2;background:#fff3b8}.key:nth-child(1){border-top:8px solid #ff6b6b}.key:nth-child(2){border-top:8px solid #ff9f43}.key:nth-child(3){border-top:8px solid #ffd166}.key:nth-child(4){border-top:8px solid #65c98f}.key:nth-child(5){border-top:8px solid #5aa9e6}.key:nth-child(6){border-top:8px solid #9b8afb}.key:nth-child(7){border-top:8px solid #ef88b7}.key:nth-child(8){border-top:8px solid #ff6b6b}.notechips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.chip{padding:8px 12px;border-radius:999px;background:#eef5fb;font-weight:900}.feedback{min-height:30px;font-size:clamp(16px,2vw,21px);font-weight:900;margin-top:10px}.hidden{display:none!important}.report{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px auto;max-width:680px}.stat{background:#f1f7fb;border-radius:16px;padding:13px}.stat b{display:block;font-size:26px}footer{text-align:center;padding:7px;font-size:12px;opacity:.65}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.confetti{position:fixed;top:-15px;width:10px;height:14px;z-index:20;animation:fall 2.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}@media(max-height:500px){header{padding:5px 12px}.card{padding:10px 16px}h1{font-size:25px}h2{font-size:21px}.key{height:120px}.big{font-size:46px}p{font-size:14px}.row{margin-top:8px}.piano{margin:9px auto 5px}}
</style></head><body><div class="app"><header><div class="brand">🎵 Mi Primera Clase de Música</div><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div></header><div class="progress"><div class="bar" id="bar"></div></div><main><section class="card" id="screen"></section></main><footer>Aprender música es escuchar, descubrir, tocar e imitar.</footer></div>
<script>
const S=document.getElementById('screen'),bar=document.getElementById('bar'),stars=document.getElementById('stars');let step=0,score=0,attempts=0,correct=0,audioCtx=null,seq=[],input=[],locked=false;const notes=[{n:'DO',f:261.63},{n:'RE',f:293.66},{n:'MI',f:329.63},{n:'FA',f:349.23},{n:'SOL',f:392},{n:'LA',f:440},{n:'SI',f:493.88},{n:'DO↑',f:523.25}];
function ctx(){return audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)())}function tone(f,d=.55,type='sine'){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.32,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.03)}function update(){bar.style.width=step/5*100+'%';stars.textContent='★ '.repeat(score)+'☆ '.repeat(5-score)}function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.88;speechSynthesis.speak(u)}}function btn(txt,fn,cl='action primary'){return `<button class="${cl}" onclick="${fn}">${txt}</button>`}function next(){step++;score=Math.min(5,score+1);update();render()}function render(){update();if(step===0)welcome();if(step===1)soundGame();if(step===2)learn3();if(step===3)imitate();if(step===4)fullPiano();if(step===5)finish()}
function welcome(){S.innerHTML=`<div class="big">🎧🎹</div><h1>¡Hola, pequeño músico!</h1><p>Hoy vas a descubrir que los sonidos pueden ser diferentes y aprenderás tus primeras notas musicales.</p><div class="notechips"><span class="chip">👂 Escucha</span><span class="chip">🎵 Descubre</span><span class="chip">👆 Toca</span><span class="chip">🧠 Imita</span></div><div class="row">${btn('▶️ Comenzar','next()')}</div>`}
function soundGame(){S.innerHTML=`<h2>👂 1. Escucha los sonidos</h2><p>Escucha y decide: <b>¿es grave o agudo?</b></p><div class="big">🔊</div><div class="row"><button class="choice" onclick="answerSound('grave',this)">🐘 GRAVE</button><button class="choice" onclick="answerSound('agudo',this)">🐦 AGUDO</button></div><div class="row"><button class="action" onclick="playQuestion()">🔊 Escuchar otra vez</button></div><div class="feedback" id="fb"></div>`;window.soundAnswer=Math.random()>.5?'grave':'agudo';setTimeout(playQuestion,250)}function playQuestion(){tone(soundAnswer==='grave'?146.83:659.25,.7)}function answerSound(a,b){attempts++;if(a===soundAnswer){correct++;b.classList.add('good');document.getElementById('fb').textContent='🎉 ¡Muy bien! Reconociste la altura del sonido.';say('¡Muy bien!');setTimeout(next,900)}else{b.classList.add('bad');document.getElementById('fb').textContent='💡 Escucha otra vez. Tú puedes.';say('Escucha otra vez');setTimeout(()=>b.classList.remove('bad'),600);playQuestion()}}
function learn3(){S.innerHTML=`<h2>🎼 2. Conoce tus primeras notas</h2><p>Primero conoceremos <b>DO, RE y MI</b>. Toca cada tecla y escucha.</p>${piano(3)}<div class="feedback" id="fb">Toca las tres notas para conocerlas.</div><div class="row"><button id="go3" class="action primary hidden" onclick="next()">¡Ya las conocí! →</button></div>`;window.seen=new Set()}function piano(count=8){return `<div class="piano">${notes.slice(0,count).map((x,i)=>`<button class="key" id="k${i}" onclick="press(${i})"><span>${x.n}</span><small>♪</small></button>`).join('')}</div>`}function press(i){tone(notes[i].f);let k=document.getElementById('k'+i);if(k){k.classList.add('lit');setTimeout(()=>k.classList.remove('lit'),180)}if(step===2){seen.add(i);say(notes[i].n.replace('↑',''));if(seen.size===3){document.getElementById('fb').textContent='⭐ ¡Excelente! Ya escuchaste DO, RE y MI.';document.getElementById('go3').classList.remove('hidden')}}if(step===3&&!locked)checkSeq(i)}
function imitate(){seq=[0,1,2];input=[];locked=true;S.innerHTML=`<h2>🎯 3. Imita la melodía</h2><p>Escucha <b>DO – RE – MI</b>. Después tócala tú.</p><div class="notechips"><span class="chip">DO</span><span>→</span><span class="chip">RE</span><span>→</span><span class="chip">MI</span></div>${piano(3)}<div class="row"><button class="action" onclick="playSeq()">🔊 Escuchar</button></div><div class="feedback" id="fb">Primero escucha...</div>`;setTimeout(playSeq,400)}async function playSeq(){locked=true;input=[];document.getElementById('fb').textContent='👂 Escucha con atención...';for(let i of seq){tone(notes[i].f,.42);let k=document.getElementById('k'+i);k.classList.add('lit');await new Promise(r=>setTimeout(r,470));k.classList.remove('lit')}locked=false;document.getElementById('fb').textContent='👆 Ahora tócala tú: DO – RE – MI'}function checkSeq(i){attempts++;let expected=seq[input.length];if(i===expected){correct++;input.push(i);if(input.length===seq.length){locked=true;document.getElementById('fb').textContent='🎉 ¡Perfecto! Tocaste tu primera secuencia.';say('¡Excelente! Tocaste tu primera secuencia musical');confetti();setTimeout(next,1300)}}else{input=[];document.getElementById('fb').textContent='💡 Casi. Volvamos a escucharla.';say('Inténtalo otra vez');setTimeout(playSeq,650)}}
function fullPiano(){S.innerHTML=`<h2>🎹 4. Tu piano musical</h2><p>¡Ahora tienes todas las notas! Explora cómo suena cada una.</p>${piano(8)}<div class="notechips"><span class="chip">DO</span><span class="chip">RE</span><span class="chip">MI</span><span class="chip">FA</span><span class="chip">SOL</span><span class="chip">LA</span><span class="chip">SI</span><span class="chip">DO↑</span></div><div class="row"><button class="action" onclick="scale()">▶️ Escuchar escala</button>${btn('Terminar clase ✓','next()')}</div>`}async function scale(){for(let i=0;i<8;i++){press(i);await new Promise(r=>setTimeout(r,330))}}function finish(){confetti();let pct=attempts?Math.round(correct/attempts*100):100;S.innerHTML=`<div class="big">🏆</div><h1>¡Lo lograste!</h1><p>Completaste tu primera clase de música.</p><div class="report"><div class="stat"><b>5/5</b>Etapas</div><div class="stat"><b>${pct}%</b>Precisión</div><div class="stat"><b>🎵</b>DO–SI</div></div><p>Hoy aprendiste a diferenciar sonidos, reconocer notas y repetir una pequeña secuencia musical.</p><div class="row"><button class="action primary" onclick="restart()">🔁 Practicar otra vez</button></div>`}function restart(){step=0;score=0;attempts=0;correct=0;render()}function confetti(){for(let i=0;i<70;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=`hsl(${Math.random()*360} 85% 62%)`;e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}render();
</script></body></html>
