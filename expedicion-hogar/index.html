<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f2d"><title>Expedición Científica del Hogar</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#d8f2ff,#ebf8e7 55%,#fff3cf);color:#17342a}.app{max-width:1050px;margin:auto;padding:14px}.hero,.card{background:#fff;border-radius:26px;box-shadow:0 14px 34px #173f2d22}.hero{padding:22px;background:linear-gradient(135deg,#173f2d,#2d7750);color:white}.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:8px 0}.hero p{line-height:1.5}.grid{display:grid;grid-template-columns:1fr 390px;gap:15px;margin-top:15px}.card{padding:17px}.map{position:relative;height:560px;overflow:hidden;border-radius:22px;background:linear-gradient(#bce9ff 0 32%,#b8dfa7 32% 72%,#efd18a 72%)}.map:before{content:"";position:absolute;right:-45px;top:170px;width:185px;height:470px;background:#6ac5e8;border:6px solid #ffffff55;border-radius:50%;transform:rotate(17deg)}.path{position:absolute;inset:0;width:100%;height:100%;z-index:2}.base{fill:none;stroke:#fff5c9;stroke-width:18;stroke-linecap:round;stroke-dasharray:18 12}.level{position:absolute;z-index:4;width:68px;height:68px;border-radius:50%;border:5px solid white;background:#aab8b0;color:white;font-size:1.7rem;box-shadow:0 8px 18px #173f2d40}.level span{position:absolute;top:63px;left:50%;transform:translateX(-50%);background:#fffffff2;color:#17342a;font-size:.68rem;font-weight:800;padding:5px 8px;border-radius:999px;white-space:nowrap}.level.active{background:#ffd45c;color:#173f2d;transform:scale(1.08)}.level.done{background:#49cb77;color:#113c28}.level.locked{opacity:.55;filter:grayscale(.8)}.l0{left:7%;bottom:7%}.l1{left:34%;bottom:17%}.l2{left:64%;bottom:8%}.l3{right:8%;bottom:35%}.l4{left:54%;top:40%}.l5{left:20%;top:46%}.l6{left:10%;top:18%}.l7{right:16%;top:9%}.explorer{position:absolute;z-index:5;font-size:2.4rem;transform:translate(-50%,-50%);transition:.5s}.decor{position:absolute;font-size:2rem}.d1{left:5%;top:43%}.d2{left:42%;top:27%}.d3{right:5%;top:52%}.d4{right:7%;top:3%}.progress{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#f4faf6;padding:12px;border-radius:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;font-weight:800}.track{height:11px;background:#dfeae3;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#55b978,#8e72e8);width:0}.badge{background:#7b61cf;color:white;padding:10px;border-radius:15px;font-weight:800}.chip{display:inline-block;background:#dff5e7;padding:8px 11px;border-radius:99px;font-weight:800}.count{font-size:.8rem;color:#68776f;font-weight:800;text-transform:uppercase;margin-top:15px}.question h2{font-size:clamp(1.35rem,3vw,2rem);line-height:1.25}.tip{background:#fff7dc;border:1px solid #edd68b;padding:11px;border-radius:15px;color:#655315}.question input,.question textarea,#report input,#report textarea{width:100%;border:2px solid #dbe9e0;border-radius:16px;padding:14px;font:inherit;margin-top:13px}.question textarea,#report textarea{min-height:120px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.choice{display:block}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;min-height:54px;padding:12px;border:2px solid #dbe9e0;border-radius:15px;background:#fff;font-weight:750}.choice input:checked+span{background:#dff5e7;border-color:#55b978}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:800;min-height:48px;touch-action:manipulation}.primary{background:linear-gradient(135deg,#4a7cff,#345dca);color:#fff}.secondary{background:#fff;border:2px solid #dbe9e0;color:#173f2d}.btn:disabled{opacity:.4}.celebrate{display:none;position:fixed;inset:0;z-index:20;background:#082016c9;place-items:center;padding:18px}.celebrate.show{display:grid}.modal{max-width:500px;background:#fff;border-radius:28px;padding:26px;text-align:center}.big{font-size:5rem}.report{display:none}.report.show{display:block}.reportHead{background:linear-gradient(135deg,#173f2d,#2d7750);color:white;border-radius:21px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat{text-align:center;background:#f2faf5;padding:13px;border-radius:15px}.stat b{display:block;font-size:1.5rem}.answer{background:#f6faf7;padding:10px;border-radius:12px;margin:7px 0}.answer b{display:block}.section{border-top:1px solid #dbe9e0;margin-top:14px;padding-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.questionCard{order:-1}.map{height:500px}}@media(max-width:600px){.choices,.stats,.progress{grid-template-columns:1fr}.map{height:455px}.level{width:56px;height:56px;font-size:1.35rem;border-width:4px}.level span{top:51px;font-size:.6rem}.nav{flex-direction:column-reverse}.btn{width:100%}}@media print{.hero,.mapCard,.progress,.question{display:none!important}.grid{display:block}.card{box-shadow:none}.report{display:block!important}}</style></head><body><main class="app"><section class="hero"><b>🗺️ Actividad familiar para realizar con calma</b><h1>Exploradoras del Hogar</h1><p>Observen, pregunten, cuenten y descubran. No es una tarea para entregar: es una aventura para convivir y divertirse.</p></section><div class="grid"><section class="card mapCard"><h2>Mapa de la expedición</h2><p id="mapMsg">Comienza la aventura.</p><div class="map"><div class="decor d1">🌳</div><div class="decor d2">🌲</div><div class="decor d3">⛺</div><div class="decor d4">🌙</div><svg class="path" viewBox="0 0 700 620" preserveAspectRatio="none"><path class="base" d="M85 550 C170 525 190 480 260 490 S410 570 490 530 S625 440 600 350 S480 300 400 330 S230 370 180 290 S160 165 250 145 S465 165 565 85"/></svg><div id="explorer" class="explorer">🧒🏽</div><button class="level l0" data-level="0">🌿<span>Naturaleza</span></button><button class="level l1" data-level="1">🏠<span>Casa</span></button><button class="level l2" data-level="2">🎙️<span>Recuerdos</span></button><button class="level l3" data-level="3">🌙<span>Cielo</span></button><button class="level l4" data-level="4">🔢<span>Números</span></button><button class="level l5" data-level="5">🍎<span>Cocina</span></button><button class="level l6" data-level="6">🤝<span>Equipo</span></button><button class="level l7" data-level="7">🏆<span>Final</span></button></div></section><section class="card questionCard"><div class="progress"><div><div class="row"><span>Progreso</span><span id="pText">0 de 40</span></div><div class="track"><div id="fill" class="fill"></div></div></div><div class="badge">🏅 <span id="badges">0</span> insignias</div></div><div id="question" class="question"></div><div id="report" class="report"></div></section></div></main><div id="celebrate" class="celebrate"><div class="modal"><div id="bigIcon" class="big">🏅</div><h2>¡Zona explorada!</h2><p id="celebrateText"></p><button id="continueBtn" class="btn primary">Abrir la siguiente zona</button></div></div><script>var M=[{t:'Guardianes de la naturaleza',i:'🌿',b:'Botánica Junior',tip:'Observa sin arrancar plantas ni tocar animales desconocidos.',q:[['¿Cuántos árboles puedes observar en casa o cerca?','number'],['¿Sabes el nombre de alguno?','text'],['¿Cuál planta o flor te parece más bonita y por qué?','textarea'],['Describe dos hojas con formas diferentes.','textarea'],['¿Viste un insecto o ave? ¿Qué hacía?','textarea']]},{t:'Detectives de la casa',i:'🏠',b:'Detective del Hogar',tip:'No abras lugares privados ni muevas objetos pesados.',q:[['¿De qué material parece ser el techo?','choice',['Lámina','Teja','Concreto','Madera','Otro','No sé']],['¿Cuántas ventanas puedes contar?','number'],['¿Qué espacio recibe más luz natural?','text'],['Busca tres formas geométricas. ¿Dónde las viste?','textarea'],['¿Qué objeto ayuda a ahorrar agua o energía?','textarea']]},{t:'Entrevista de recuerdos',i:'🎙️',b:'Guardiana de Historias',tip:'Puedes entrevistar a cualquier adulto de confianza.',q:[['¿A quién entrevistaste? Escribe solo su relación contigo.','text'],['¿Cuál era su juego favorito?','text'],['¿Cómo era su escuela?','textarea'],['¿Qué comida le recuerda a su infancia?','text'],['¿Qué consejo bonito quiere compartir contigo?','textarea']]},{t:'Científicas del cielo',i:'🌙',b:'Astrónoma en Entrenamiento',tip:'Si observas de noche, hazlo con una persona adulta.',q:[['¿A qué hora observaste el cielo?','time'],['¿Cómo estaba el cielo?','choice',['Despejado','Pocas nubes','Muy nublado','Lloviendo','No observé']],['¿Viste la Luna?','choice',['Sí','No','No sé']],['Describe el cielo con tres palabras.','text'],['¿Qué sonidos escuchaste?','textarea']]},{t:'Laboratorio de cantidades',i:'🔢',b:'Maestra de los Números',tip:'Cuenta objetos visibles y no subas a lugares altos.',q:[['¿Cuántas sillas puedes contar?','number'],['¿Cuántas plantas hay?','number'],['¿Cuántos focos visibles hay?','number'],['¿Cuántos pares de zapatos viste?','number'],['Elige dos cantidades y escribe cuál es mayor.','textarea']]},{t:'Ciencia de la cocina',i:'🍎',b:'Científica de la Cocina',tip:'No uses fuego, cuchillos ni aparatos sin supervisión.',q:[['¿Cuántos tipos de fruta encontraste?','number'],['Escribe dos alimentos de colores diferentes.','text'],['¿Qué alimento tiene un olor agradable?','text'],['¿Cuál es un platillo favorito de la familia?','text'],['¿Qué alimento saludable prepararías con un adulto?','textarea']]},{t:'Equipo familiar',i:'🤝',b:'Constructora de Equipo',tip:'Ayudar también significa escuchar, agradecer y cuidar.',q:[['Menciona una tarea segura en la que puedas ayudar.','text'],['¿Quién te enseñó algo útil y qué aprendiste?','textarea'],['¿Qué actividad disfrutan hacer juntos?','textarea'],['Escribe una forma de agradecer a alguien.','textarea'],['Realiza una acción amable y cuenta cómo se sintieron.','textarea']]},{t:'Gran descubrimiento',i:'🏆',b:'Gran Exploradora',tip:'No hay respuestas correctas o incorrectas.',q:[['¿Cuál fue el descubrimiento que más te sorprendió?','textarea'],['¿Qué pregunta te gustó hacer?','textarea'],['¿Qué investigarías después?','textarea'],['¿Qué aprendiste de tu familia o de tu hogar?','textarea'],['Describe tu expedición con una palabra.','text']]}];var P=[[12,88],[39,80],[69,88],[87,63],[59,43],[25,49],[16,23],[79,14]],T=40,S={a:{}},mi=0,qi=0;try{S=JSON.parse(localStorage.getItem('expHogar4')||'{"a":{}}')}catch(e){S={a:{}}}if(!S.a)S.a={};mi=S.mi||0;qi=S.qi||0;function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function key(a,b){return'm'+a+'q'+b}function answered(a,b){return String(S.a[key(a,b)]||'').trim()!==''}function missionDone(a){for(var b=0;b<M[a].q.length;b++)if(!answered(a,b))return false;return true}function count(){var n=0;for(var a=0;a<M.length;a++)for(var b=0;b<M[a].q.length;b++)if(answered(a,b))n++;return n}function gidx(a,b){return a*5+b}function save(){S.mi=mi;S.qi=qi;localStorage.setItem('expHogar4',JSON.stringify(S))}function inputHtml(k,q,v){if(q[1]==='choice'){var h='<div class="choices">';for(var x=0;x<q[2].length;x++){var o=q[2][x];h+='<label class="choice"><input type="radio" name="'+k+'" value="'+esc(o)+'" '+(v===o?'checked':'')+'><span>'+o+'</span></label>'}return h+'</div>'}if(q[1]==='textarea')return'<textarea data-key="'+k+'" placeholder="Escribe lo que descubriste...">'+esc(v)+'</textarea>';if(q[1]==='number')return'<input data-key="'+k+'" type="number" min="0" max="999" inputmode="numeric" placeholder="Escribe una cantidad" value="'+esc(v)+'">';if(q[1]==='time')return'<input data-key="'+k+'" type="time" value="'+esc(v)+'">';return'<input data-key="'+k+'" type="text" maxlength="250" placeholder="Escribe tu respuesta" value="'+esc(v)+'">'}function render(){var m=M[mi],q=m.q[qi],k=key(mi,qi),v=S.a[k]||'',qe=document.getElementById('question');document.getElementById('report').className='report';qe.style.display='block';qe.innerHTML='<div class="chip">'+m.i+' '+m.t+'</div><div class="count">Pregunta '+(gidx(mi,qi)+1)+' de '+T+'</div><h2>'+q[0]+'</h2><div class="tip">💡 '+m.tip+'</div>'+inputHtml(k,q,v)+'<div class="nav"><button id="prevBtn" class="btn secondary" '+(gidx(mi,qi)===0?'disabled':'')+'>← Anterior</button><button id="nextBtn" class="btn primary">'+(gidx(mi,qi)===T-1?'Ver informe final':'Siguiente →')+'</button></div>';var fields=qe.querySelectorAll('input,textarea');for(var z=0;z<fields.length;z++){fields[z].addEventListener('input',saveAnswer,false);fields[z].addEventListener('change',saveAnswer,false)}document.getElementById('prevBtn').addEventListener('click',prev,false);document.getElementById('nextBtn').addEventListener('click',next,false);update()}function saveAnswer(e){var el=e.target;if(el.type==='radio'){if(el.checked)S.a[el.name]=el.value}else S.a[el.getAttribute('data-key')]=el.value.trim();save();update()}function next(){var end=qi===4,last=mi===7&&end;if(last){report();return}if(end){if(missionDone(mi)){document.getElementById('bigIcon').textContent=M[mi].i;document.getElementById('celebrateText').textContent='Ganaste la insignia “'+M[mi].b+'”.';document.getElementById('celebrate').className='celebrate show';return}mi++;qi=0}else qi++;save();render();window.scrollTo(0,0)}function prev(){if(qi>0)qi--;else if(mi>0){mi--;qi=4}save();render()}function update(){var n=count(),bad=0;for(var a=0;a<8;a++)if(missionDone(a))bad++;document.getElementById('pText').textContent=n+' de '+T;document.getElementById('fill').style.width=(n/T*100)+'%';document.getElementById('badges').textContent=bad;document.getElementById('mapMsg').textContent='Ahora exploras: '+M[mi].t;var lv=document.querySelectorAll('.level');for(var i=0;i<lv.length;i++){lv[i].className='level l'+i;if(missionDone(i))lv[i].className+=' done';else if(i===mi)lv[i].className+=' active';else if(i>mi)lv[i].className+=' locked'}var e=document.getElementById('explorer');e.style.left=P[mi][0]+'%';e.style.top=P[mi][1]+'%'}function report(){document.getElementById('question').style.display='none';var n=count(),bad=0,sections='';for(var a=0;a<8;a++){if(missionDone(a))bad++;sections+='<div class="section"><h3>'+M[a].i+' '+M[a].t+'</h3>';for(var b=0;b<5;b++){var v=S.a[key(a,b)]||'Sin respuesta';sections+='<div class="answer"><b>'+M[a].q[b][0]+'</b>'+esc(v)+'</div>'}sections+='</div>'}var r=document.getElementById('report');r.innerHTML='<div class="reportHead"><h2>📘 Informe final</h2><p>Resumen para la familia o el docente.</p><input id="student" placeholder="Nombre de la alumna o alumno"></div><div class="stats"><div class="stat"><b>'+n+'/40</b>respuestas</div><div class="stat"><b>'+bad+'/8</b>insignias</div><div class="stat"><b>'+Math.round(n/40*100)+'%</b>avance</div></div>'+sections+'<div class="section"><label><b>Observaciones del adulto</b></label><textarea placeholder="Fortalezas, descubrimientos o apoyo necesario..."></textarea></div><div class="nav"><button id="backBtn" class="btn secondary">Volver</button><button id="printBtn" class="btn primary">Imprimir o guardar PDF</button></div>';r.className='report show';document.getElementById('backBtn').addEventListener('click',function(){r.className='report';render()},false);document.getElementById('printBtn').addEventListener('click',function(){window.print()},false)}document.getElementById('continueBtn').addEventListener('click',function(){document.getElementById('celebrate').className='celebrate';mi++;qi=0;save();render()},false);var levelButtons=document.querySelectorAll('.level');for(var i=0;i<levelButtons.length;i++)levelButtons[i].addEventListener('click',function(){var t=parseInt(this.getAttribute('data-level'),10);if(t<=mi||missionDone(t)){mi=t;qi=0;save();render()}},false);render();</script></body></html>
