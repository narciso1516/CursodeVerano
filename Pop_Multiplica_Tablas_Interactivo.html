<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pop Multiplica — Tablas Interactivas</title>
<style>
:root{--bg:#fff8ef;--ink:#263238;--card:#fff;--shadow:0 12px 30px #503c3020;--r:26px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff8ef,#effcff);color:var(--ink);min-height:100vh}body.phone .app{max-width:430px}body.tablet .app{max-width:900px}.app{margin:auto;padding:16px;min-height:100vh}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:5px 0;font-size:clamp(27px,6vw,46px)}.sub{margin:0;color:#607d8b;font-weight:650}.panel{background:#ffffffd9;backdrop-filter:blur(8px);border-radius:26px;padding:16px;box-shadow:0 12px 30px #503c3020;margin-top:14px}.devices,.tabs,.modes{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:18px;padding:12px 15px;font-weight:800;background:#edf2f4;color:#263238;cursor:pointer;touch-action:manipulation}.btn.active,.tab.active{background:#263238;color:#fff}.sound{font-size:20px}.tabs{margin-top:12px}.tab{min-width:55px;font-size:18px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}body.phone .board{grid-template-columns:repeat(3,1fr)}.bubble{aspect-ratio:1;border:0;border-radius:28%;font-size:clamp(18px,4vw,28px);font-weight:900;color:#17323b;box-shadow:inset 0 -6px 0 #00000016,0 5px 12px #00000014;cursor:pointer;transition:.12s;touch-action:manipulation}.bubble:active,.bubble.pop{transform:scale(.87);box-shadow:inset 0 4px 8px #0002}.bubble:nth-child(6n+1){background:#ffe66d}.bubble:nth-child(6n+2){background:#76e6d2}.bubble:nth-child(6n+3){background:#6ed6ff}.bubble:nth-child(6n+4){background:#c7a6ff}.bubble:nth-child(6n+5){background:#ff85bd}.bubble:nth-child(6n){background:#a9ef8c}.challenge{text-align:center}.question{font-size:clamp(35px,9vw,70px);font-weight:950;margin:10px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{font-size:26px;padding:18px;border:0;border-radius:20px;background:#eaf7ff;font-weight:900}.stats{display:flex;justify-content:space-around;text-align:center;font-weight:850}.big{font-size:24px}.feedback{min-height:32px;font-size:20px;font-weight:900;margin:8px}.help{font-size:14px;color:#607d8b;line-height:1.45}.hidden{display:none}.star{position:fixed;pointer-events:none;font-size:28px;animation:fly .8s forwards}@keyframes fly{to{transform:translateY(-100px) rotate(100deg);opacity:0}}
</style></head><body><main class="app"><div class="top"><div><h1>🫧 Pop Multiplica</h1><p class="sub">Toca, escucha, descubre y aprende las tablas.</p></div><button class="btn sound" id="sound">🔊 Sonido</button></div><section class="panel"><b>¿Qué dispositivo usas?</b><div class="devices" style="margin-top:8px"><button class="btn device active" data-d="auto">✨ Automático</button><button class="btn device" data-d="phone">📱 iPhone / celular</button><button class="btn device" data-d="tablet">▰ Tablet</button></div><div class="modes" style="margin-top:14px"><button class="btn mode active" data-mode="learn">🧠 Aprender</button><button class="btn mode" data-mode="challenge">🎯 Reto</button></div><div class="tabs" id="tabs"></div></section><section class="panel" id="learn"><div id="board" class="board"></div><p class="help">Toca una burbuja: escucharás la multiplicación y verás su resultado. Puedes repetirla cuantas veces quieras.</p></section><section class="panel challenge hidden" id="challenge"><div class="stats"><div>⭐ Puntos<div class="big" id="score">0</div></div><div>🔥 Racha<div class="big" id="streak">0</div></div><div>🏆 Récord<div class="big" id="best">0</div></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></section></main><script>
let table=2,soundOn=true,score=0,streak=0,best=+(localStorage.popBest||0),correct=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function speak(t){if(!soundOn)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.85;speechSynthesis.speak(u)}function tone(ok){if(!soundOn)return;let A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=ok?660:180;g.gain.value=.05;o.start();o.stop(A.currentTime+.13)}function renderTabs(){let el=$('#tabs');el.innerHTML='';for(let n=1;n<=12;n++){let b=document.createElement('button');b.className='tab'+(n===table?' active':'');b.textContent='×'+n;b.onclick=()=>{table=n;renderTabs();renderBoard();newQuestion()};el.appendChild(b)}}function renderBoard(){let b=$('#board');b.innerHTML='';for(let i=1;i<=12;i++){let x=document.createElement('button');x.className='bubble';x.innerHTML=`${table} × ${i}<br><b>${table*i}</b>`;x.onclick=e=>{x.classList.add('pop');setTimeout(()=>x.classList.remove('pop'),180);speak(`${table} por ${i} es igual a ${table*i}`);spark(e.clientX,e.clientY)};b.appendChild(x)}}function spark(x,y){for(let i=0;i<5;i++){let s=document.createElement('span');s.className='star';s.textContent=['⭐','✨','💫'][i%3];s.style.left=(x+Math.random()*50-25)+'px';s.style.top=(y+Math.random()*30-15)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function newQuestion(){let n=1+Math.floor(Math.random()*12);correct=table*n;$('#question').textContent=`${table} × ${n} = ?`;let vals=new Set([correct]);while(vals.size<4)vals.add(Math.max(1,correct+(Math.floor(Math.random()*7)-3)*table));let a=[...vals].sort(()=>Math.random()-.5);$('#answers').innerHTML='';a.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=e=>check(v,e);$('#answers').appendChild(b)});$('#feedback').textContent='';speak(`¿Cuánto es ${table} por ${n}?`)}function check(v,e){if(v===correct){score+=10+streak*2;streak++;best=Math.max(best,streak);localStorage.popBest=best;tone(true);$('#feedback').textContent='🎉 ¡Correcto!';speak(`¡Muy bien! La respuesta es ${correct}`);spark(e.clientX,e.clientY);setTimeout(newQuestion,900)}else{streak=0;tone(false);$('#feedback').textContent='💡 Casi. Inténtalo otra vez.';speak('Casi. Inténtalo otra vez.')}$('#score').textContent=score;$('#streak').textContent=streak;$('#best').textContent=best}$$('.device').forEach(b=>b.onclick=()=>{$$('.device').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.body.classList.remove('phone','tablet');if(b.dataset.d!=='auto')document.body.classList.add(b.dataset.d)});$$('.mode').forEach(b=>b.onclick=()=>{$$('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=b.dataset.mode==='challenge';$('#learn').classList.toggle('hidden',c);$('#challenge').classList.toggle('hidden',!c);if(c)newQuestion()});$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊 Sonido':'🔇 Silencio';if(soundOn)speak('Sonido activado')};$('#best').textContent=best;renderTabs();renderBoard();
</script></body></html>
