<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#eaf7e9"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f17f83"/>
      <stop offset="1" stop-color="#ef6678"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#173b2b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="105" cy="115" r="78" fill="#dff2ff" stroke="#173b2b" stroke-width="12"/>
  <circle cx="105" cy="115" r="47" fill="#bfe9fb" stroke="#4a7990" stroke-width="6"/>
  <path d="M150 170 L214 235" stroke="#6d4126" stroke-width="28" stroke-linecap="round"/>

  <g fill="#4d8d42" opacity=".95">
    <path d="M20 35 C85 0 105 5 135 22 C85 37 50 54 20 35Z"/>
    <path d="M45 85 C95 45 120 45 150 55 C110 78 83 98 45 85Z"/>
    <path d="M920 30 C990 0 1040 5 1070 35 C1015 44 970 56 920 30Z"/>
    <path d="M950 90 C1005 52 1040 60 1072 78 C1025 96 990 111 950 90Z"/>
  </g>

  <text x="540" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="74" font-weight="900" fill="#12396f">¡ATENCIÓN, FAMILIAS!</text>
  <rect x="185" y="150" width="710" height="84" rx="42" fill="url(#banner)" filter="url(#shadow)"/>
  <text x="540" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fff">¡Una aventura para disfrutar juntos!</text>

  <text x="90" y="310" font-family="Arial, sans-serif" font-size="35" fill="#173329">
    <tspan x="90" dy="0">Muy pronto realizaremos una actividad especial:</tspan>
    <tspan x="90" dy="52" font-weight="900" fill="#7d4bd3">“Misión: Exploradores del Hogar”.</tspan>
    <tspan x="90" dy="52">Una experiencia para jugar, descubrir y aprender</tspan>
    <tspan x="90" dy="52">juntos en casa.</tspan>
  </text>

  <rect x="70" y="510" width="940" height="170" rx="34" fill="#f2f9d8" stroke="#64a24f" stroke-width="5" stroke-dasharray="14 12" filter="url(#shadow)"/>
  <text x="540" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#24723d">ESTA ACTIVIDAD ES PARA</text>
  <text x="540" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="900">
    <tspan fill="#ef687a">DIVERTIRSE</tspan><tspan fill="#173329"> Y </tspan><tspan fill="#7d4bd3">EXPLORAR</tspan>
  </text>

  <g font-family="Arial, sans-serif" fill="#173329" font-size="31">
    <circle cx="115" cy="750" r="37" fill="#7d4bd3"/><text x="115" y="762" text-anchor="middle" font-size="35" fill="#fff">👨‍👩‍👧</text>
    <text x="175" y="742"><tspan font-weight="700">Explorarán juntos</tspan><tspan> su casa, el entorno,</tspan><tspan x="175" dy="42">el cielo, las plantas y muchas cosas más.</tspan></text>

    <circle cx="115" cy="865" r="37" fill="#42a85e"/><text x="115" y="877" text-anchor="middle" font-size="35" fill="#fff">🔎</text>
    <text x="175" y="857"><tspan font-weight="700">Harán preguntas, observarán y contarán;</tspan><tspan x="175" dy="42">también compartirán historias y recuerdos.</tspan></text>

    <circle cx="115" cy="980" r="37" fill="#f1a239"/><text x="115" y="992" text-anchor="middle" font-size="35" fill="#fff">♥</text>
    <text x="175" y="972"><tspan>Será un tiempo para </tspan><tspan font-weight="700">convivir, reír y platicar</tspan><tspan x="175" dy="42">en familia.</tspan></text>

    <circle cx="115" cy="1095" r="37" fill="#4d9bc4"/><text x="115" y="1107" text-anchor="middle" font-size="35" fill="#fff">⏱</text>
    <text x="175" y="1087"><tspan font-weight="700">Háganla con calma, paciencia y sin prisas.</tspan><tspan x="175" dy="42">No hay tiempo límite.</tspan></text>
  </g>

  <rect x="620" y="715" width="390" height="300" rx="24" fill="#d5a35f" stroke="#81562c" stroke-width="7" transform="rotate(4 815 865)" filter="url(#shadow)"/>
  <text x="815" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#4d2f17" transform="rotate(4 815 865)">
    <tspan x="815" dy="0">NO ES PARA ENTREGAR</tspan>
    <tspan x="815" dy="55">NO ES UNA TAREA</tspan>
    <tspan x="815" dy="55">ES UN MOMENTO</tspan>
    <tspan x="815" dy="55">PARA COMPARTIR</tspan>
  </text>

  <rect x="55" y="1200" width="970" height="105" rx="28" fill="#13577d" filter="url(#shadow)"/>
  <text x="540" y="1245" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#fff">Exploren, jueguen, observen, pregunten y disfruten.</text>
  <text x="540" y="1285" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#fff">¡JUNTOS HACEN LA MEJOR AVENTURA!</text>

  <text x="930" y="1130" font-size="105">🧭</text>
  <text x="810" y="330" font-size="170">👧🏽‍🌾</text>
  <text x="875" y="455" font-size="100">🔍</text>
</svg>