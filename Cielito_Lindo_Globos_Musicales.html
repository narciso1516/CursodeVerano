<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cielito Lindo — Globos Musicales</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#17324d;background:linear-gradient(#bfe9ff 0 68%,#dff4cf 68%)}header{position:fixed;z-index:20;left:12px;right:12px;top:12px}.card,#melody,#next{background:#fffffff0;border-radius:18px;box-shadow:0 8px 28px #2452}.card{padding:10px 14px}h1{font-size:clamp(17px,4vw,25px);margin:0}small{opacity:.75}#game{position:fixed;inset:0;overflow:hidden}.balloon{--c:#4e9bf5;position:absolute;width:74px;height:88px;border:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 24%,#fff9 0 7%,transparent 8%),var(--c);color:#fff;font-size:25px;font-weight:900;box-shadow:inset -8px -10px 16px #0002,0 7px 13px #2452;cursor:pointer;animation:floatUp var(--dur) linear forwards}.balloon:after{content:"";position:absolute;left:34px;bottom:-10px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:11px solid var(--c)}@keyframes floatUp{from{transform:translateY(125vh)}to{transform:translateY(-150px)}}.pop{animation:pop .2s ease-out forwards!important}@keyframes pop{to{transform:scale(1.6);opacity:0}}.wrong{filter:grayscale(.8)}#next{position:fixed;z-index:25;left:50%;top:90px;transform:translateX(-50%);padding:9px 18px;font-weight:900}#melody{position:fixed;z-index:25;left:12px;right:12px;bottom:12px;padding:10px 12px;max-height:25vh;overflow:auto}#notes{display:flex;gap:6px;flex-wrap:wrap}.note{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#22a06b;font-weight:900}.ctrl{border:0;border-radius:12px;padding:8px 12px;margin-top:8px;font-weight:800;background:#17324d;color:#fff}#message{position:fixed;z-index:50;inset:0;display:none;place-items:center;background:#17324d66}#message>div{background:white;border-radius:24px;padding:25px;text-align:center}.confetti{position:fixed;z-index:60;width:10px;height:14px;top:-20px;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}@media(max-width:600px){.balloon{width:66px;height:79px;font-size:22px}#next{top:105px}}</style></head><body><header><div class="card"><h1>🎈 Cielito Lindo: Globos Musicales</h1><small>Toca la nota correcta. La siguiente aparece inmediatamente para que la melodía no se detenga.</small></div></header><div id="next">Busca: <strong id="target">do</strong> 🎯</div><main id="game"></main><section id="melody"><b>Tu melodía:</b> <span>⭐ <b id="score">0</b> · 🔥 <b id="streak">0</b> · 🎵 <b id="progress">0</b>/<b id="total">0</b></span><div id="notes"></div><button class="ctrl" id="sound">🔊 Sonido: sí</button> <button class="ctrl" id="restart">↻ Reiniciar</button></section><div id="message"><div><h2>🎉 ¡Canción completada!</h2><p id="final"></p><button class="ctrl" onclick="restart()">Jugar otra vez</button></div></div><script>const melody=["do","do","la","si","sol","do","do","la","si","sol","do","do","sol","fa","mi","re","do","mi","mi","fa","sol","la","sol","fa","mi","re","do","do","mi","sol","sol","fa","mi","re","re","fa","la","la","sol","fa","mi","re","do","sol","sol","fa","mi","re","mi","fa","sol","mi","re","do"];const allNotes=["do","re","mi","fa","sol","la","si"],colors=["#3f8efc","#ef476f","#8e67d4","#ff8c42","#06a77d","#e2a400","#e85aad"];const game=document.querySelector('#game'),notesEl=document.querySelector('#notes');let index=0,score=0,streak=0,soundOn=true,timer,audioCtx;total.textContent=melody.length;function update(){target.textContent=melody[index]||'✓';document.querySelector('#score').textContent=score;document.querySelector('#streak').textContent=streak;progress.textContent=index}function tone(note){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const f={do:261.63,re:293.66,mi:329.63,fa:349.23,sol:392,la:440,si:493.88}[note],o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.29)}function makeBalloon(note,isTarget=false){const b=document.createElement('button');b.className='balloon';b.textContent=note;b.dataset.target=isTarget?'1':'0';b.style.setProperty('--c',colors[allNotes.indexOf(note)]);b.style.setProperty('--dur',(5.5+Math.random()*2)+'s');b.style.left=(3+Math.random()*86)+'%';b.onclick=()=>hit(b,note);b.onanimationend=()=>{const t=b.dataset.target==='1';b.remove();if(t&&index<melody.length)spawnTarget()};game.appendChild(b)}function spawnTarget(){if(index>=melody.length||document.querySelector('.balloon[data-target="1"]'))return;makeBalloon(melody[index],true)}function distractor(){if(index>=melody.length)return;const a=allNotes.filter(n=>n!==melody[index]);makeBalloon(a[Math.floor(Math.random()*a.length)])}function hit(b,note){if(index>=melody.length)return;if(note===melody[index]){tone(note);b.dataset.target='0';b.classList.add('pop');setTimeout(()=>b.remove(),190);const n=document.createElement('span');n.className='note';n.textContent=note;notesEl.appendChild(n);index++;streak++;score+=10+(streak>=5?5:0);update();document.querySelectorAll('.balloon[data-target="1"]').forEach(x=>x.dataset.target='0');if(index>=melody.length)finish();else{spawnTarget();distractor()}}else{streak=0;score=Math.max(0,score-2);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),300);update()}}function finish(){clearInterval(timer);for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}final.textContent=`Lograste ${score} puntos y completaste ${melody.length} notas.`;message.style.display='grid'}function restart(){message.style.display='none';document.querySelectorAll('.balloon').forEach(x=>x.remove());notesEl.innerHTML='';index=score=streak=0;update();clearInterval(timer);spawnTarget();for(let i=0;i<3;i++)setTimeout(distractor,i*160);timer=setInterval(distractor,800)}restart.onclick=restart;sound.onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Sonido: sí':'🔇 Sonido: no'};restart();</script></body></html>
