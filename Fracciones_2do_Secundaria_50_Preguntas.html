<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fracciones 2.º de secundaria</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(#eef4ff,#fff7e8);color:#172033}.app{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border:2px solid #dbeafe;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 12px 28px #1d4ed81c}h1{color:#17458a;margin:0}.meta,.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}.bar{height:15px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b);width:0}.cat{font-size:90px;text-align:center;position:relative}.cat b{font-size:62px;position:absolute;left:50%;top:16px;transform:translateX(-50%)}.badge{display:inline-block;background:#7c3aed;color:white;padding:8px 13px;border-radius:99px;font-weight:800}.q{font-size:28px;font-weight:900;text-align:center;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button,button{border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:800;cursor:pointer}.answers button{background:#eff6ff;border:3px solid #93c5fd;color:#1e3a8a}.ok{background:#dcfce7!important;border-color:#22c55e!important;color:#166534!important}.bad{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b!important}.feedback{display:none;padding:13px;border-radius:14px;margin-top:14px;font-weight:800;text-align:center}.next{display:none;background:#16a34a;color:#fff}.listen{background:#0ea5e9;color:#fff}.example{display:none;background:#fff7ed;border:3px solid #f59e0b;border-radius:18px;padding:18px;margin:16px 0}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.map span{background:#eef2ff;padding:8px;border-radius:10px;text-align:center;font-size:12px;font-weight:800}.map .on{background:#fde68a}.map .done{background:#bbf7d0}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1}.frac em:first-child{border-bottom:2px solid;padding:0 .2em}.frac em{font-style:normal;padding:.05em .2em}.author{font-size:14px}.author a{color:#17458a;font-weight:800}@media(max-width:700px){.answers{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.q{font-size:23px}}</style></head><body><main class="app"><section class="card"><h1>😼 Misión Fracciones — 2.º de Secundaria</h1><p>50 retos basados en la hoja de búsqueda entregada en clase.</p><input id="name" placeholder="Nombre del alumno" style="width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:12px"><div class="meta"><b id="status"></b><b id="score">⭐ 0/50</b><b id="tries">Intentos: 0</b></div><div class="bar"><i id="progress"></i></div><div id="map" class="map"></div></section><section class="card"><span id="badge" class="badge"></span> <b id="skill"></b><div class="cat">😼<b>🕶️</b></div><div id="example" class="example"><h3>Ejemplo resuelto</h3><p id="exq"></p><p id="exs"></p><b id="exa"></b><p><button id="start">Comenzar misión</button></p></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="controls"><button id="listen" class="listen">🔊 Escuchar</button><button id="next" class="next">Siguiente reto ➜</button></div></section><section class="card author"><b>Material elaborado por Ing. Luis Alberto Antonio Narciso.</b><p><a href="https://narciso1516.github.io/narcisotesting.com/">Currículum profesional</a> · <a href="https://github.com/narciso1516/CursodeVerano">Repositorio educativo</a></p></section></main><script>const M=[{t:'Lectura estratégica',i:'🔎',s:'Interpretación de representaciones',e:['¿A y B representan la misma cantidad?','Ambas muestran 1 de 2 partes coloreadas.','Sí: representan 1/2.'],q:[['¿Qué conjunto representa únicamente 1/2?',['A, B, H, J','A, C, D, H','B, F, H, Q','J, K, L, N'],0,'A, B, H y J representan la mitad.'],['¿Qué conjunto contiene enteros completos?',['E, O, U, Y, Z','E, G, O, U, Y','O, Q, U, Y, Z','E, O, V, Y, Z'],0,'Todas sus partes están coloreadas.'],['¿Qué es correcto sobre C y K?',['Ambas representan 2/4','C=1/4 y K=2/4','C=2/3 y K=1/2','No pueden compararse'],0,'Ambas tienen 2 de 4 partes coloreadas.'],['¿Cuál es menor que 1/2?',['Q','G','D','I'],2,'D representa 1/4.'],['¿Cuál es mayor que 1/2 y menor que 1?',['F','Q','L','AB'],1,'Q representa 2/3.']]},{t:'Equivalencias',i:'🔄',s:'Fracciones equivalentes',e:['Compara B y C.','B=1/2 y C=2/4; 2/4 se simplifica entre 2.','B y C son equivalentes.'],q:[['¿Qué pareja es equivalente?',['A y C','D y G','F y Q','L y AA'],0,'A=1/2 y C=2/4.'],['¿Qué pareja NO es equivalente?',['B y K','H y R','J y AD','F y I'],3,'F=1/3 e I=2/3.'],['¿Qué igualdad respalda la hoja?',['1/2=2/4','1/3=2/3','1/4=3/4','2/3=3/4'],0,'Una mitad equivale a dos cuartos.'],['¿Cuál es la forma irreducible de AA?',['1/2','3/4','1/4','3/2'],1,'AA representa 3/4.'],['¿Por qué H y AB son equivalentes?',['Mismo color','Ambas son círculos','Ocupan la mitad del entero','Mismas divisiones'],2,'La parte coloreada ocupa la misma cantidad.']]},{t:'Comparación y orden',i:'⚖️',s:'Comparación de fracciones',e:['Ordena 1/4, 1/2 y 3/4.','Escribe 1/2 como 2/4 y compara numeradores.','1/4 < 1/2 < 3/4.'],q:[['Ordena D, B y G de menor a mayor.',['D, B, G','B, D, G','G, B, D','D, G, B'],0,'1/4 < 1/2 < 3/4.'],['¿Cuál es mayor?',['F','Q','Son iguales','No se sabe'],1,'2/3 es mayor que 1/3.'],['¿Qué relación es correcta?',['L>N','N>L','L=N','Ambas son enteros'],1,'N=1/2 y L=1/4.'],['¿Cuál está más cerca de 1?',['AA','Q','K','F'],0,'3/4 está más cerca de 1.'],['Ordena de mayor a menor.',['G,Q,B,D','Q,G,B,D','G,B,Q,D','D,B,Q,G'],0,'3/4>2/3>1/2>1/4.']]},{t:'Simplificación',i:'✂️',s:'Forma irreducible',e:['Simplifica 2/4.','Divide numerador y denominador entre 2.','2/4=1/2.'],q:[['¿Cuál se simplifica a 1/2?',['2/4','1/3','3/4','2/3'],0,'2/4÷2=1/2.'],['¿Cuál ya es irreducible?',['2/4','3/4','2/2','4/4'],1,'3 y 4 no tienen factores comunes.'],['O representa 4/4. ¿A qué equivale?',['0','1/4','1','4'],2,'4/4=1.'],['¿Cómo se simplifica 2/4?',['Sumar 2','Dividir ambos entre 2','Restar 2','Multiplicar por 2'],1,'Se divide entre un factor común.'],['¿Cuál equivale a 1?',['U','AA','Q','K'],0,'U representa 4/4.']]},{t:'Decimales y porcentajes',i:'📊',s:'Conversión de representaciones',e:['Convierte 1/2.','1÷2=0.5; luego multiplica por 100.','1/2=0.5=50%.'],q:[['¿Qué porcentaje representa D?',['20%','25%','50%','75%'],1,'1/4=25%.'],['¿Qué decimal representa G?',['0.25','0.5','0.66','0.75'],3,'3/4=0.75.'],['¿Qué porcentaje representa Q?',['33.3%','50%','66.7%','75%'],2,'2/3≈66.7%.'],['¿Qué figura representa 50%?',['L','AB','F','AA'],1,'AB=1/2.'],['¿Qué conversión es correcta?',['1/4=0.4','3/4=0.75=75%','2/3=0.2','1/2=0.25'],1,'3÷4=0.75.']]},{t:'Proporcionalidad',i:'📐',s:'Razonamiento proporcional',e:['Si 1/2 son 12 alumnos, ¿cuál es el total?','El entero es el doble de la mitad.','24 alumnos.'],q:[['Q=2/3 de 30 alumnos. ¿Cuántos?',['10','15','20','25'],2,'2/3 de 30=20.'],['G=3/4 de $800. ¿Cuánto?',['$200','$400','$600','$750'],2,'3/4 de $800=$600.'],['D=1/4 equivale a 7 km. ¿Total?',['14','21','28','35'],2,'7×4=28.'],['AB=1/2 de 46 libros. ¿Cuántos?',['21','23','24','26'],1,'La mitad de 46 es 23.'],['F=1/3 son 18 litros. ¿Total?',['36','48','54','60'],2,'18×3=54.']]},{t:'Operaciones',i:'➕',s:'Suma y resta de fracciones',e:['Suma 1/4+2/4.','Suma numeradores porque los denominadores son iguales.','3/4.'],q:[['D+K equivale a:',['3/4','3/8','1/2','1'],0,'1/4+2/4=3/4.'],['G−D equivale a:',['1/4','1/2','2/3','1'],1,'3/4−1/4=1/2.'],['1/3+1/3=',['1/6','2/3','2/6','1'],1,'Se suman numeradores.'],['2/3−1/3=',['1/3','1/2','1/6','0'],0,'La diferencia es 1/3.'],['¿Qué suma produce un entero?',['1/4+1/4','1/3+1/3','1/2+1/2','1/4+1/2'],2,'Dos mitades forman 1.']]},{t:'Detectives del error',i:'🧠',s:'Análisis de errores',e:['“2/4 es mayor que 1/2 porque 2>1”.','No se comparan solo numeradores; 2/4 se simplifica.','Son equivalentes.'],q:[['“3/4 es menor que 2/3”.',['Correcto','Incorrecto: 3/4 es mayor','Son iguales','No se comparan'],1,'0.75>0.667.'],['“E representa 3”.',['E=3/3=1','E=1/3','E=2/3','Es correcto'],0,'Tres tercios forman un entero.'],['“K representa 2/2”. ¿Error?',['Tiene 4 partes: 2/4','Tiene 2 partes','Es 4/2','No es fracción'],0,'El denominador es 4.'],['Un alumno dice 1/4=0.4. ¿Qué hacer?',['Dividir 1 entre 4','Multiplicar','Sumar','Restar'],0,'1÷4=0.25.'],['“Mayor denominador, mayor fracción”. ¿Contraejemplo?',['1/4<1/2','3/4>2/3','1/3<2/3','Todas'],3,'No basta observar el denominador.']]},{t:'Modelación',i:'🧩',s:'Aplicación en contextos',e:['Una batería está a 3/4. ¿Qué figura?','Busca 4 partes iguales y 3 coloreadas.','G o AA.'],q:[['Depósito lleno a 2/3. ¿Figura circular?',['F','Q','H','D'],1,'Q representa 2/3.'],['25% eligió una opción. ¿Figura?',['D','B','Q','G'],0,'25%=1/4.'],['Meta completada al 75%. ¿Rectángulo?',['AA','R','W','Y'],0,'AA=3/4.'],['Receta usa 1/3 de taza. ¿Rectángulo?',['T','N','R','AA'],0,'T=1/3.'],['Descarga al 100%. ¿Círculo?',['O','Q','V','X'],0,'O representa el entero.']]},{t:'Reto integrador',i:'🏆',s:'Integración de habilidades',e:['G=3/4. Exprésala como decimal y porcentaje.','3÷4=0.75; multiplica por 100.','0.75 y 75%.'],q:[['¿Qué cadena es correcta?',['B=K=AB=1/2','D=G=1/4','F=Q=2/3','E=Y=1/2'],0,'Todas representan la mitad.'],['D+G=',['1/2','3/4','1','4/8'],2,'1/4+3/4=1.'],['Q−F=',['1/3','1/2','2/3','1'],0,'2/3−1/3=1/3.'],['AA=3/4 de 120 tareas. ¿Cuántas?',['30','60','80','90'],3,'3/4 de 120=90.'],['¿Qué define correctamente una fracción?',['Forma y color','Partes iguales, tomadas y entero','Siempre menor que 1','Solo mismo denominador'],1,'Se considera el entero y sus partes iguales.']]}];let m=0,q=0,score=0,locked=false,tries=0;const seen=Array(10).fill(false),A={};const E=x=>document.getElementById(x);function frac(s){return String(s).replace(/(\d+)\/(\d+)/g,'<span class="frac"><em>$1</em><em>$2</em></span>')}function map(){E('map').innerHTML=M.map((x,i)=>`<span class="${i<m?'done':i===m?'on':''}">${x.i} ${i+1}. ${x.t}</span>`).join('')}function render(){locked=false;let z=M[m],x=z.q[q],k=m+'-'+q;A[k]??=0;E('badge').textContent=z.i+' Misión '+(m+1)+': '+z.t;E('skill').textContent='Skill: '+z.s;E('feedback').style.display='none';E('next').style.display='none';E('example').style.display='none';E('question').style.display='block';E('answers').style.display='grid';E('listen').style.display='inline-block';if(q===0&&!seen[m]){E('example').style.display='block';E('question').style.display='none';E('answers').style.display='none';E('listen').style.display='none';E('exq').innerHTML='<b>Ejercicio:</b> '+frac(z.e[0]);E('exs').innerHTML='<b>Procedimiento:</b> '+frac(z.e[1]);E('exa').innerHTML=frac(z.e[2]);E('status').textContent='Misión '+(m+1)+' · Ejemplo';map();return}E('question').innerHTML=frac(x[0]);E('answers').innerHTML='';x[1].forEach((o,i)=>{let b=document.createElement('button');b.innerHTML=frac(o);b.onclick=()=>answer(i,b);E('answers').appendChild(b)});E('status').textContent=`Misión ${m+1} · Reto ${q+1}/5`;E('score').textContent=`⭐ ${score}/50`;E('tries').textContent='Intentos: '+tries;E('progress').style.width=((m*5+q)/50*100)+'%';map()}function answer(i,b){if(locked)return;let x=M[m].q[q],k=m+'-'+q;tries++;A[k]++;E('tries').textContent='Intentos: '+tries;if(i===x[2]){locked=true;score++;b.classList.add('ok');[...E('answers').children].forEach(y=>y.disabled=true);E('feedback').innerHTML='¡Correcto! '+frac(x[3]);E('feedback').style.display='block';E('feedback').style.background='#dcfce7';E('next').style.display='inline-block';E('score').textContent=`⭐ ${score}/50`}else{b.classList.add('bad');b.disabled=true;E('feedback').textContent='Respuesta incorrecta. Analiza e intenta otra opción.';E('feedback').style.display='block';E('feedback').style.background='#fff7ed'}}E('start').onclick=()=>{seen[m]=true;render()};E('next').onclick=()=>{q++;if(q===5){q=0;m++}if(m===10){alert(`Actividad terminada. Resultado: ${score}/50. Intentos: ${tries}`);return}render()};E('listen').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(M[m].q[q][0].replace(/(\d+)\/(\d+)/g,'$1 sobre $2'));u.lang='es-MX';u.rate=.8;speechSynthesis.speak(u)};render();</script></body></html>
