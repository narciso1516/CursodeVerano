<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedro | Operación Lectura</title><style>:root{--bg:#07110e;--card:#11201b;--a:#ff9f1c;--g:#31d7a5;--t:#f5f7f6;--m:#aebdb7;--r:#ff5d5d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#2b2413 0,#07110e 42%);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:900px;margin:auto;padding:12px}.hud{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:8px;padding:8px;background:#07110eee;backdrop-filter:blur(10px)}.hud div,.card{background:#ffffff0a;border:1px solid #ffffff18;border-radius:18px}.hud div{padding:9px 11px}.hud small{display:block;color:var(--m);font-size:11px}.hero,.card{padding:22px;margin-top:12px}.hero{min-height:75vh;display:grid;place-items:center;text-align:center}.hero h1{font-size:clamp(38px,10vw,76px);line-height:.9;margin:12px}.hero b{color:var(--a)}button{font:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;cursor:pointer}.btn,.opt{position:relative;z-index:5;min-height:54px;border:0;border-radius:15px;font-weight:800}.btn{padding:15px 20px;background:linear-gradient(135deg,var(--a),#ffd166);color:#111}.opt{width:100%;text-align:left;padding:15px;margin:6px 0;background:#ffffff0b;color:var(--t);border:1px solid #ffffff18}.opt:active,.btn:active{transform:scale(.98)}.good{border-color:var(--g)!important;background:#31d7a51d!important}.bad{border-color:var(--r)!important;background:#ff5d5d18!important}.muted{color:var(--m);line-height:1.55}.pass{font-size:17px;line-height:1.7;padding:18px;border-radius:15px;background:#0003}.q{font-size:23px;line-height:1.25;margin:12px 0}.feedback{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#ffffff09}.next{display:none;width:100%;margin-top:12px}.prog{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g));width:0}.mosaic{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:linear-gradient(#1c493d,#08120f);margin-top:12px}.scene{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 75% 22%,#ffbd55 0 7%,transparent 8%),linear-gradient(160deg,transparent 45%,#16372e 46% 63%,#0a1d17 64%)}.scene strong{font-size:clamp(25px,8vw,64px);color:#ffd166;text-shadow:0 5px 20px #000;text-align:center}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none}.tile{background:linear-gradient(135deg,#172720,#09120f);border:1px solid #ffffff0b;transition:.55s}.tile.off{opacity:0;transform:scale(.3) rotate(8deg)}#game,#result{display:none}.tag{color:var(--g);font-weight:900;font-size:12px;letter-spacing:.08em}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.map span{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:#ffffff08;color:#71827b;font-weight:900}.map .on{color:var(--a);outline:1px solid var(--a)}.map .done{color:var(--g);background:#31d7a518}@media(max-width:650px){.app{padding:8px}.hero,.card{padding:16px}.pass{font-size:16px}.q{font-size:20px}.hud{grid-template-columns:1fr 1fr 1fr}.hud strong{font-size:14px}}@media(hover:hover){.opt:hover{border-color:#ff9f1c88}}</style></head><body><div class="app"><div class="hud"><div><small>JUGADOR</small><strong>Pedro</strong></div><div><small>XP</small><strong id="xp">0</strong></div><div><small>RETO</small><strong id="count">0/25</strong></div></div><section class="hero" id="intro"><div><div class="tag">MISIÓN DE COMPRENSIÓN LECTORA</div><h1>OPERACIÓN<br><b>LECTURA</b></h1><p class="muted">25 retos. Cada respuesta correcta revela una pieza de la imagen secreta. Si fallas, vuelve al texto y busca evidencia.</p><button type="button" class="btn" id="start">INICIAR MISIÓN</button></div></section><main id="game"><section class="card"><div class="tag" id="mission"></div><h2 id="title"></h2><div class="pass" id="pass"></div></section><section class="card"><div class="tag" id="skill"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button type="button" class="btn next" id="next">SIGUIENTE RETO →</button></section><section class="card"><strong>🧩 Imagen secreta</strong><div class="mosaic"><div class="scene"><strong>¡VICTORIA,<br>PEDRO!</strong></div><div class="tiles" id="tiles"></div></div><div class="prog"><i id="bar"></i></div><div class="map" id="map"></div></section></main><section class="card" id="result"><div class="tag">MISIÓN COMPLETADA</div><h1>🏆 ¡Excelente trabajo, Pedro!</h1><p class="muted" id="summary"></p><button type="button" class="btn" id="again">JUGAR DE NUEVO</button></section></div><script>const M=[{t:'La señal en el bosque',s:'Pedro llegó con su equipo a una zona boscosa para recuperar una antena portátil. La tormenta había derribado ramas y bloqueado el camino principal. En la radio escucharon: “No crucen el puente viejo. La madera está dañada. Busquen el sendero marcado con piedras blancas”. El sendero era más largo, pero pasaba cerca de una caseta con agua. Solo quedaban dos botellas para cuatro personas, así que el grupo decidió llegar primero a la caseta.'},{t:'El mensaje incompleto',s:'En una estación abandonada, Pedro encontró un mensaje: “La siguiente clave está donde el sol desaparece detrás de las montañas. No confíes únicamente en la brújula”. En el mapa, la torre estaba al oeste. Una pared tenía una flecha y la palabra “ocaso”. Pedro propuso mirar por una ventana para comprobar hacia dónde bajaba el sol. Al hacerlo, evitaron un camino que terminaba en un barranco.'},{t:'La mochila perdida',s:'Camino a la zona segura, Pedro recordó que había dejado una mochila con baterías cerca de una roca. Sin ellas, la radio podía apagarse. Primero marcó su posición en el mapa. Luego pidió a dos compañeros que esperaran bajo techo y regresó con Ana. Encontraron la mochila, guardaron las baterías en una bolsa impermeable porque empezaba a llover y volvieron por el sendero corto.'},{t:'La decisión del refugio',s:'El grupo encontró dos refugios. El primero era grande, pero tenía ventanas rotas y el techo parcialmente dañado. El segundo era una caseta pequeña, con puerta firme, techo completo y salida trasera. Se esperaba viento fuerte. Pedro también vio ramas pesadas sobre el primer techo. Aunque la caseta tenía menos espacio, el equipo la eligió porque ofrecía mayor seguridad.'},{t:'La transmisión final',s:'En la torre final, Pedro necesitaba una clave de cuatro palabras: seguridad, observar, planear y cooperar. Comprendió que resumían cómo habían superado los problemas: observaron el entorno, compararon riesgos, hicieron planes y trabajaron juntos. La torre respondió: “Sobrevivir no siempre depende de correr más; muchas veces depende de comprender mejor la información antes de actuar”.'}];const Q=[[0,'Literal','¿Qué bloqueó el camino principal?',['Un vehículo','Ramas de la tormenta','Una puerta'],1,'Las ramas derribadas por la tormenta.'],[0,'Literal','¿Qué advertía la radio?',['No cruzar el puente viejo','No entrar a la caseta','No usar el mapa'],0,'El puente viejo tenía la madera dañada.'],[0,'Causa y efecto','¿Por qué fueron primero a la caseta?',['Para dormir','Porque tenían poca agua','Porque perdieron la radio'],1,'Solo quedaban dos botellas para cuatro personas.'],[0,'Idea principal','¿Qué priorizó el grupo?',['Seguridad y recursos','Velocidad','Evitar caminar'],0,'Eligieron una ruta más segura aunque fuera más larga.'],[0,'Inferencia','¿Qué podía ocurrir si usaban el puente?',['Podía ceder','La radio se apagaba','Aparecía otra caseta'],0,'La madera dañada hacía probable que el puente fallara.'],[1,'Vocabulario','¿Qué significa “ocaso”?',['Salida del sol','Puesta del sol','Tormenta'],1,'Ocaso es la puesta del sol.'],[1,'Inferencia','¿Por qué Pedro comprobó varias pistas?',['Para decidir con evidencia','Porque no sabía usar brújula','Para perder tiempo'],0,'Comparó mapa, flecha y posición del sol.'],[1,'Literal','¿Dónde estaba la torre?',['Norte','Este','Oeste'],2,'El mapa indicaba oeste.'],[1,'Causa y efecto','¿Qué evitaron al observar?',['Quedarse sin agua','Un camino hacia un barranco','Perder la mochila'],1,'La observación evitó tomar el camino equivocado.'],[1,'Pensamiento crítico','¿Cuál fue la mejor estrategia?',['Correr','Comprobar distintas pistas','Elegir lo más corto'],1,'Verificar varias fuentes reduce errores.'],[2,'Secuencia','¿Qué hizo Pedro primero?',['Marcó su posición','Apagó la radio','Esperó diez minutos'],0,'Primero marcó su posición en el mapa.'],[2,'Literal','¿Qué tenía la mochila?',['Comida','Baterías','Una brújula'],1,'La mochila contenía baterías.'],[2,'Causa y efecto','¿Qué podía pasar sin baterías?',['La radio podía apagarse','El puente se rompía','La torre se movía'],0,'Sin energía, la radio podía apagarse.'],[2,'Secuencia','¿Qué hicieron al encontrar la mochila?',['Protegieron las baterías','Durmieron','Cruzaron un puente'],0,'Las guardaron en una bolsa impermeable.'],[2,'Inferencia','¿Por qué dos compañeros esperaron bajo techo?',['Para mantenerlos protegidos','Porque estaban castigados','Para buscar una torre'],0,'Pedro evitó exponer innecesariamente a todo el equipo.'],[3,'Literal','¿Qué problema tenía el primer refugio?',['Era pequeño','Ventanas rotas y techo dañado','No tenía salida'],1,'El primer edificio estaba parcialmente dañado.'],[3,'Evidencia','¿Qué decía el pronóstico?',['Mucho calor','Viento fuerte','Nieve'],1,'Se esperaba viento fuerte.'],[3,'Pensamiento crítico','¿Por qué era mejor la caseta?',['Tenía más espacio','Techo completo, puerta firme y salida','Estaba más lejos'],1,'Ofrecía mejores condiciones de seguridad.'],[3,'Inferencia','¿Qué riesgo tenían las ramas pesadas?',['Podían caer con el viento','Podían dar agua','Reparaban el techo'],0,'El viento podía hacerlas caer.'],[3,'Idea principal','¿Qué criterio usó el equipo?',['Tamaño','Menor riesgo','Belleza'],1,'Eligieron la opción con menor riesgo.'],[4,'Literal','¿Cuántas palabras tenía la clave?',['Dos','Cuatro','Cinco'],1,'La clave tenía cuatro palabras.'],[4,'Síntesis','¿Qué representan las cuatro palabras?',['Lugares','Estrategias de las misiones','Objetos'],1,'Resumen las estrategias utilizadas.'],[4,'Comprensión global','¿Cuál es el mensaje central?',['Correr siempre','Comprender ayuda a decidir mejor','Los mapas no sirven'],1,'Comprender la información mejora las decisiones.'],[4,'Inferencia','¿Qué característica muestra Pedro?',['Actúa sin pensar','Observa y usa evidencia','Evita colaborar'],1,'Pedro compara riesgos y pistas antes de actuar.'],[4,'Metacognición','Si una pregunta es difícil, ¿qué conviene hacer?',['Responder al azar','Releer y buscar pistas','Cerrar la actividad'],1,'Releer y buscar evidencia mejora la comprensión.']];let n=0,xp=0,first=0,tries=0;const $=id=>document.getElementById(id);function tiles(){let h='';for(let i=0;i<25;i++)h+=`<i class="tile ${i<n?'off':''}"></i>`;$('tiles').innerHTML=h}function map(){let h='';for(let i=0;i<25;i++)h+=`<span class="${i<n?'done':i===n?'on':''}">${i<n?'✓':i+1}</span>`;$('map').innerHTML=h}function hud(){$('xp').textContent=xp;$('count').textContent=`${n}/25`;$('bar').style.width=`${n*4}%`;tiles();map()}function render(){let z=Q[n],m=M[z[0]];$('mission').textContent=`MISIÓN ${z[0]+1} DE 5`;$('title').textContent=m.t;$('pass').textContent=m.s;$('skill').textContent=`RETO ${n+1} · ${z[1]}`;$('q').textContent=z[2];$('fb').style.display='none';$('next').style.display='none';$('opts').innerHTML='';tries=0;z[3].forEach((o,i)=>{let b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.addEventListener('click',e=>{e.preventDefault();answer(i,b)});$('opts').appendChild(b)});hud()}function answer(i,b){if(b.disabled)return;tries++;let z=Q[n];if(i===z[4]){document.querySelectorAll('.opt').forEach(v=>v.disabled=true);b.classList.add('good');xp+=tries===1?100:60;if(tries===1)first++;$('fb').innerHTML='✅ <b>Correcto.</b> '+z[5];$('fb').style.display='block';$('next').style.display='block'}else{b.disabled=true;b.classList.add('bad');$('fb').innerHTML='❌ Vuelve al texto y busca una pista antes de probar otra opción.';$('fb').style.display='block'}}$('start').addEventListener('click',()=>{$('intro').style.display='none';$('game').style.display='block';render()});$('next').addEventListener('click',()=>{n++;if(n===25){$('game').style.display='none';$('result').style.display='block';$('count').textContent='25/25';$('bar').style.width='100%';$('summary').textContent=`Aciertos al primer intento: ${first}/25 · XP total: ${xp}. La imagen secreta fue revelada por completo.`;tiles()}else render();window.scrollTo({top:0,behavior:'smooth'})});$('again').addEventListener('click',()=>{n=0;xp=0;first=0;$('result').style.display='none';$('game').style.display='block';render();window.scrollTo(0,0)});hud();</script></body></html>
