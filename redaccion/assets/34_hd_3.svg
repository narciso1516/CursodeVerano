<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1200" height="800" rx="34" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="764" rx="28" fill="none" stroke="#F98520" stroke-width="5"/><circle cx="105" cy="105" r="60" fill="#F98520"/><text x="105" y="126" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="white" text-anchor="middle">3</text><text x="600" y="112" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#F05A16" text-anchor="middle">LA COMA</text><rect x="250" y="150" width="700" height="78" rx="16" fill="#FFE08A"/><text x="600" y="183" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#17324d" text-anchor="middle">La coma (,) sirve para hacer pequeñas pausas</text><text x="600" y="215" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#17324d" text-anchor="middle">y para ordenar nuestras ideas.</text><text x="105" y="280" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#F05A16">Se usa para:</text><circle cx="125" cy="332" r="22" fill="#F05A16"/><text x="125" y="341" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">1</text><text x="170" y="342" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#17324d">Separar elementos en una lista</text><text x="170" y="385" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#F05A16">Ejemplo:</text><rect x="170" y="400" width="610" height="58" rx="14" fill="#FFF1D9" stroke="#F7B456" stroke-width="2"/><text x="195" y="438" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17324d">Compré manzanas, plátanos, uvas y peras.</text><text x="820" y="440" font-family="Arial, Helvetica, sans-serif" font-size="52">🍎 🍌 🍇 🍐</text><circle cx="125" cy="512" r="22" fill="#F05A16"/><text x="125" y="521" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">2</text><text x="170" y="522" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#17324d">Dar más información</text><text x="170" y="565" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#F05A16">Ejemplo:</text><rect x="170" y="580" width="820" height="58" rx="14" fill="#FFF1D9" stroke="#F7B456" stroke-width="2"/><text x="195" y="618" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#17324d">Mi hermana, que es muy amable, me ayudó con la tarea.</text><circle cx="125" cy="690" r="22" fill="#F05A16"/><text x="125" y="699" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">3</text><text x="170" y="700" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#17324d">Indicar dónde, cuándo o cómo</text><rect x="610" y="672" width="500" height="68" rx="14" fill="#F7F0FF" stroke="#A879D0" stroke-width="2"/><text x="860" y="701" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#5D2E8C" text-anchor="middle">Recuerda: la coma no es un punto.</text><text x="860" y="729" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5D2E8C" text-anchor="middle">No termina la oración, solo hace una pausa.</text></svg>