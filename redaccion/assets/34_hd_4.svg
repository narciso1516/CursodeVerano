<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="34" fill="#fffdf7"/><rect x="18" y="18" width="1164" height="764" rx="28" fill="none" stroke="#F24F93" stroke-width="5"/><circle cx="105" cy="105" r="60" fill="#F24F93"/><text x="105" y="126" font-family="Arial" font-size="64" font-weight="800" fill="white" text-anchor="middle">4</text><text x="600" y="92" font-family="Arial" font-size="52" font-weight="900" fill="#E83E86" text-anchor="middle">¡TU MISIÓN!</text><text x="600" y="140" font-family="Arial" font-size="35" font-weight="900" fill="#164D9A" text-anchor="middle">CONSTRUYE TU PRIMER PÁRRAFO</text><rect x="250" y="165" width="700" height="60" rx="16" fill="#FFE08A"/><text x="600" y="205" font-family="Arial" font-size="25" font-weight="800" fill="#17324d" text-anchor="middle">Sigue estos pasos para escribir un buen párrafo.</text><rect x="70" y="270" width="240" height="250" rx="22" fill="#fff" stroke="#1558B0" stroke-width="4"/><circle cx="105" cy="305" r="24" fill="#1558B0"/><text x="105" y="314" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">1</text><text x="190" y="350" font-family="Arial" font-size="24" font-weight="800" fill="#17324d" text-anchor="middle">Elige una idea</text><text x="190" y="382" font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">principal.</text><circle cx="190" cy="455" r="34" fill="#FDDB1B"/><line x1="190" y1="420" x2="190" y2="390" stroke="#F98520" stroke-width="8"/><rect x="350" y="270" width="240" height="250" rx="22" fill="#fff" stroke="#12832E" stroke-width="4"/><circle cx="385" cy="305" r="24" fill="#12832E"/><text x="385" y="314" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">2</text><text x="470" y="350" font-family="Arial" font-size="24" font-weight="800" fill="#17324d" text-anchor="middle">Escribe 3 o más</text><text x="470" y="382" font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">oraciones sobre esa idea.</text><rect x="420" y="420" width="100" height="70" rx="8" fill="#F7FBFF" stroke="#17324d" stroke-width="3"/><line x1="435" y1="440" x2="505" y2="440" stroke="#17324d" stroke-width="3"/><line x1="435" y1="455" x2="505" y2="455" stroke="#17324d" stroke-width="3"/><line x1="435" y1="470" x2="495" y2="470" stroke="#17324d" stroke-width="3"/><rect x="630" y="270" width="240" height="250" rx="22" fill="#fff" stroke="#6A2E9B" stroke-width="4"/><circle cx="665" cy="305" r="24" fill="#6A2E9B"/><text x="665" y="314" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">3</text><text x="750" y="350" font-family="Arial" font-size="24" font-weight="800" fill="#17324d" text-anchor="middle">Usa punto y seguido,</text><text x="750" y="382" font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">punto y aparte y comas.</text><text x="750" y="470" font-family="Georgia" font-size="74" font-weight="900" fill="#6A2E9B" text-anchor="middle">, .</text><rect x="910" y="270" width="240" height="250" rx="22" fill="#fff" stroke="#F05A16" stroke-width="4"/><circle cx="945" cy="305" r="24" fill="#F05A16"/><text x="945" y="314" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">4</text><text x="1030" y="350" font-family="Arial" font-size="24" font-weight="800" fill="#17324d" text-anchor="middle">Revisa tu texto:</text><text x="1030" y="382" font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">claridad, orden y sentido.</text><circle cx="1030" cy="455" r="34" fill="none" stroke="#17324d" stroke-width="8"/><line x1="1055" y1="480" x2="1090" y2="515" stroke="#17324d" stroke-width="10"/><rect x="80" y="560" width="1040" height="140" rx="18" fill="#FFF2F7" stroke="#EE8DB6" stroke-width="3"/><rect x="100" y="538" width="210" height="42" rx="10" fill="#F24F93"/><text x="205" y="567" font-family="Arial" font-size="22" font-weight="800" fill="white" text-anchor="middle">Ejemplo de párrafo:</text><text x="115" y="610" font-family="Arial" font-size="22" font-weight="600" fill="#17324d">Me encanta el verano.  Durante las vacaciones, voy a la playa con mi familia.</text><text x="115" y="650" font-family="Arial" font-size="22" font-weight="600" fill="#17324d">El mar es hermoso, la arena está caliente y el sol brilla mucho.  Por las tardes,</text><text x="115" y="682" font-family="Arial" font-size="22" font-weight="600" fill="#17324d">leemos cuentos, comemos helado y jugamos en la orilla.</text><rect x="170" y="720" width="860" height="52" rx="14" fill="#F0E4FA"/><text x="600" y="755" font-family="Arial" font-size="26" font-weight="900" fill="#5D2E8C" text-anchor="middle">¡Escribe, ordena tus ideas y cuenta grandes historias!</text></svg>