<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="35" fill="#fff"/><rect x="20" y="20" width="1160" height="760" rx="30" fill="none" stroke="#25408F" stroke-width="8"/><circle cx="100" cy="105" r="58" fill="#25408F"/><text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="70" font-weight="700" fill="white">1</text><text x="650" y="105" text-anchor="middle" font-family="Arial" font-size="58" font-weight="700" fill="#25408F">¿QUÉ ES UN PÁRRAFO?</text><rect x="180" y="145" width="840" height="85" rx="20" fill="#FDDB1B"/><text x="600" y="180" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Un párrafo es un grupo de oraciones</text><text x="600" y="214" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">que hablan de la misma idea.</text><rect x="110" y="270" width="980" height="105" rx="22" fill="#eef6ff" stroke="#BBD6DF" stroke-width="5"/><text x="600" y="315" text-anchor="middle" font-family="Arial" font-size="27" fill="#17324d">Cuando juntamos varias oraciones relacionadas,</text><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="27" fill="#17324d">nuestras ideas se entienden mejor.</text><text x="115" y="430" font-family="Arial" font-size="28" font-weight="700" fill="#25408F">Ejemplo:</text><rect x="110" y="455" width="980" height="190" rx="22" fill="#fff" stroke="#25408F" stroke-width="4"/><text x="160" y="505" font-family="Arial" font-size="28" font-weight="700" fill="#25408F">Lucas tiene un perro.</text><text x="160" y="555" font-family="Arial" font-size="28" font-weight="700" fill="#05713D">Se llama Max y es muy juguetón.</text><text x="160" y="605" font-family="Arial" font-size="28" font-weight="700" fill="#7a35a5">Todas las tardes, Lucas lo lleva al parque para que corra y juegue.</text><rect x="110" y="685" width="980" height="60" rx="18" fill="#eef6ff"/><text x="600" y="723" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">⭐ Un buen párrafo tiene ideas claras, oraciones ordenadas y sentido completo.</text></svg>