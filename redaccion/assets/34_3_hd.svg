<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="35" fill="#fff"/><rect x="20" y="20" width="1160" height="760" rx="30" fill="none" stroke="#F98520" stroke-width="8"/><circle cx="100" cy="105" r="58" fill="#F05A00"/><text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="70" font-weight="700" fill="white">3</text><text x="650" y="115" text-anchor="middle" font-family="Arial" font-size="60" font-weight="700" fill="#F05A00">LA COMA</text><rect x="170" y="160" width="860" height="75" rx="20" fill="#FDDB1B"/><text x="600" y="193" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#17324d">La coma (,) sirve para hacer pequeñas pausas</text><text x="600" y="224" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#17324d">y para ordenar nuestras ideas.</text><text x="90" y="290" font-family="Arial" font-size="30" font-weight="700" fill="#F05A00">Se usa para:</text><text x="105" y="350" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">1. Separar elementos en una lista</text><rect x="105" y="375" width="990" height="65" rx="15" fill="#fff4dc"/><text x="135" y="417" font-family="Arial" font-size="26" fill="#17324d">Ejemplo: Compré manzanas, plátanos, uvas y peras.</text><text x="105" y="495" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">2. Dar más información</text><rect x="105" y="520" width="990" height="65" rx="15" fill="#fff4dc"/><text x="135" y="562" font-family="Arial" font-size="26" fill="#17324d">Ejemplo: Mi hermana, que es muy amable, me ayudó con la tarea.</text><text x="105" y="640" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">3. Indicar dónde, cuándo o cómo</text><rect x="105" y="665" width="990" height="65" rx="15" fill="#fff4dc"/><text x="135" y="707" font-family="Arial" font-size="26" fill="#17324d">Ejemplo: Iremos al parque, después de comer, para jugar fútbol.</text><text x="600" y="765" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#7a35a5">⭐ Recuerda: la coma no es un punto. No termina la oración, solo hace una pausa.</text></svg>