<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="35" fill="#fff"/><rect x="20" y="20" width="1160" height="760" rx="30" fill="none" stroke="#05713D" stroke-width="8"/><circle cx="100" cy="105" r="58" fill="#05713D"/><text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="70" font-weight="700" fill="white">2</text><text x="650" y="90" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#05713D">PUNTO Y SEGUIDO</text><text x="650" y="145" text-anchor="middle" font-family="Arial" font-size="46" font-weight="700" fill="#7a35a5">Y PUNTO Y APARTE</text><rect x="180" y="175" width="840" height="60" rx="18" fill="#FDDB1B"/><text x="600" y="214" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">Los puntos nos ayudan a organizar nuestras ideas.</text><rect x="80" y="275" width="1040" height="190" rx="22" fill="#f1fbf5" stroke="#05713D" stroke-width="5"/><text x="120" y="325" font-family="Arial" font-size="36" font-weight="700" fill="#05713D">PUNTO Y SEGUIDO</text><text x="120" y="365" font-family="Arial" font-size="27" fill="#17324d">Se usa para separar oraciones que hablan de la misma idea.</text><text x="120" y="410" font-family="Arial" font-size="27" font-weight="700" fill="#05713D">Ejemplo: María lee todos los días. Le gusta leer cuentos de aventuras.</text><rect x="80" y="490" width="1040" height="190" rx="22" fill="#faf3ff" stroke="#7a35a5" stroke-width="5"/><text x="120" y="540" font-family="Arial" font-size="36" font-weight="700" fill="#7a35a5">PUNTO Y APARTE</text><text x="120" y="580" font-family="Arial" font-size="27" fill="#17324d">Se usa para separar ideas diferentes. Empieza un nuevo párrafo.</text><text x="120" y="625" font-family="Arial" font-size="27" font-weight="700" fill="#7a35a5">Ejemplo: María lee todos los días. / Ayer fue al cine con su familia.</text><rect x="150" y="705" width="900" height="55" rx="18" fill="#fff4c9"/><text x="600" y="740" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">💡 ¡Usar bien los puntos hace que nuestros textos se entiendan mejor!</text></svg>