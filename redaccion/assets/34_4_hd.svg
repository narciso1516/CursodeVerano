<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="35" fill="#fff"/><rect x="20" y="20" width="1160" height="760" rx="30" fill="none" stroke="#F8AEC5" stroke-width="8"/><circle cx="100" cy="105" r="58" fill="#e83e78"/><text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="70" font-weight="700" fill="white">4</text><text x="650" y="90" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="#e83e78">¡TU MISIÓN!</text><text x="650" y="140" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#25408F">CONSTRUYE TU PRIMER PÁRRAFO</text><rect x="190" y="170" width="820" height="58" rx="18" fill="#FDDB1B"/><text x="600" y="207" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">Sigue estos pasos para escribir un buen párrafo.</text><g font-family="Arial"><rect x="60" y="270" width="250" height="210" rx="20" fill="#eef6ff" stroke="#25408F" stroke-width="4"/><text x="185" y="320" text-anchor="middle" font-size="26" font-weight="700" fill="#25408F">1. Elige una</text><text x="185" y="355" text-anchor="middle" font-size="26" font-weight="700" fill="#25408F">idea principal.</text><text x="185" y="420" text-anchor="middle" font-size="55">💡</text><rect x="335" y="270" width="250" height="210" rx="20" fill="#f1fbf5" stroke="#05713D" stroke-width="4"/><text x="460" y="315" text-anchor="middle" font-size="24" font-weight="700" fill="#05713D">2. Escribe 3 o más</text><text x="460" y="350" text-anchor="middle" font-size="24" font-weight="700" fill="#05713D">oraciones que hablen</text><text x="460" y="385" text-anchor="middle" font-size="24" font-weight="700" fill="#05713D">de esa idea.</text><text x="460" y="440" text-anchor="middle" font-size="50">📝</text><rect x="610" y="270" width="250" height="210" rx="20" fill="#faf3ff" stroke="#7a35a5" stroke-width="4"/><text x="735" y="315" text-anchor="middle" font-size="23" font-weight="700" fill="#7a35a5">3. Usa punto y</text><text x="735" y="350" text-anchor="middle" font-size="23" font-weight="700" fill="#7a35a5">seguido, punto y</text><text x="735" y="385" text-anchor="middle" font-size="23" font-weight="700" fill="#7a35a5">aparte y comas.</text><text x="735" y="440" text-anchor="middle" font-size="50">✍️</text><rect x="885" y="270" width="250" height="210" rx="20" fill="#fff5ee" stroke="#F98520" stroke-width="4"/><text x="1010" y="315" text-anchor="middle" font-size="23" font-weight="700" fill="#F05A00">4. Revisa tu texto:</text><text x="1010" y="350" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">claridad, orden y</text><text x="1010" y="385" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">sentido completo.</text><text x="1010" y="440" text-anchor="middle" font-size="50">🔎</text></g><rect x="90" y="530" width="1020" height="160" rx="20" fill="#fff0f5" stroke="#F8AEC5" stroke-width="4"/><text x="120" y="570" font-family="Arial" font-size="25" font-weight="700" fill="#e83e78">Ejemplo de párrafo:</text><text x="120" y="615" font-family="Arial" font-size="25" fill="#17324d">Me encanta el verano. Durante las vacaciones, voy a la playa con mi familia.</text><text x="120" y="655" font-family="Arial" font-size="25" fill="#17324d">El mar es hermoso, la arena está caliente y el sol brilla mucho.</text><rect x="160" y="720" width="880" height="50" rx="16" fill="#f1e8ff"/><text x="600" y="752" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#25408F">⭐ ¡Escribe, ordena tus ideas y cuenta grandes historias!</text></svg>