<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1200" height="800" rx="34" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="764" rx="28" fill="none" stroke="#1558B0" stroke-width="5"/><circle cx="105" cy="105" r="60" fill="#1558B0"/><text x="105" y="126" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="white" text-anchor="middle">1</text><text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#164D9A" text-anchor="middle">¿QUÉ ES UN</text><text x="600" y="150" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#164D9A" text-anchor="middle">PÁRRAFO?</text><rect x="260" y="180" width="680" height="82" rx="18" fill="#FFE08A"/><text x="600" y="215" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17324d" text-anchor="middle">Un párrafo es un grupo de oraciones</text><text x="600" y="248" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17324d" text-anchor="middle">que hablan de la misma idea.</text><rect x="145" y="290" width="910" height="100" rx="18" fill="#F7FBFF" stroke="#6FA4E8" stroke-width="3"/><text x="600" y="330" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#17324d" text-anchor="middle">Cuando juntamos varias oraciones relacionadas,</text><text x="600" y="366" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#17324d" text-anchor="middle">nuestras ideas se entienden mejor.</text><rect x="120" y="420" width="960" height="240" rx="22" fill="#fff" stroke="#3D78CC" stroke-width="3" filter="url(#shadow)"/><rect x="145" y="395" width="150" height="46" rx="12" fill="#15498F"/><text x="220" y="427" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">Ejemplo:</text><text x="190" y="485" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#1558B0">Lucas tiene un perro.</text><text x="190" y="535" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#05713D">Se llama Max y es muy juguetón.</text><text x="190" y="585" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#6A2E9B">Todas las tardes, Lucas lo lleva</text><text x="190" y="625" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#6A2E9B">al parque para que corra y juegue.</text><text x="865" y="510" font-family="Arial, Helvetica, sans-serif" font-size="70">🐶</text><text x="875" y="585" font-family="Arial, Helvetica, sans-serif" font-size="55">🎾</text><text x="940" y="630" font-family="Arial, Helvetica, sans-serif" font-size="70">🌳</text><rect x="120" y="692" width="960" height="62" rx="16" fill="#F1F6FF" stroke="#5B8CD3" stroke-width="2"/><text x="600" y="718" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="middle">Estas oraciones forman un párrafo porque hablan de lo mismo:</text><text x="600" y="746" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#1558B0" text-anchor="middle">Lucas y su perro.</text></svg>