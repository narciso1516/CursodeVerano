<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1200" height="800" rx="34" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="764" rx="28" fill="none" stroke="#12832E" stroke-width="5"/><circle cx="105" cy="105" r="60" fill="#12832E"/><text x="105" y="126" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="white" text-anchor="middle">2</text><text x="650" y="92" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#10812A" text-anchor="middle">PUNTO Y SEGUIDO</text><text x="650" y="142" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#6A2E9B" text-anchor="middle">Y PUNTO Y APARTE</text><rect x="250" y="170" width="700" height="65" rx="16" fill="#FFE08A"/><text x="600" y="212" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#17324d" text-anchor="middle">Los puntos nos ayudan a organizar nuestras ideas.</text><rect x="90" y="270" width="1020" height="210" rx="22" fill="#FAFFFB" stroke="#2D9B45" stroke-width="4"/><text x="135" y="318" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#12832E">PUNTO Y SEGUIDO</text><text x="135" y="365" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#17324d">Se usa para separar oraciones que hablan de la misma idea.</text><text x="135" y="415" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#12832E">Ejemplo:</text><rect x="135" y="430" width="720" height="70" rx="15" fill="#F0FAF2" stroke="#77C383" stroke-width="2"/><text x="165" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17324d">María lee todos los días.  ●  Le gusta leer cuentos de aventuras.</text><text x="935" y="420" font-family="Arial, Helvetica, sans-serif" font-size="80">📖</text><rect x="90" y="515" width="1020" height="205" rx="22" fill="#FCFAFF" stroke="#8A55B5" stroke-width="4"/><text x="135" y="565" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#6A2E9B">PUNTO Y APARTE</text><text x="135" y="610" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#17324d">Se usa para separar ideas diferentes. Empieza un nuevo párrafo.</text><text x="135" y="655" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#6A2E9B">Ejemplo:</text><text x="165" y="698" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#17324d">María lee todos los días.   ●   Ayer fue al cine con su familia.</text><text x="950" y="665" font-family="Arial, Helvetica, sans-serif" font-size="80">🍿</text><rect x="220" y="742" width="760" height="40" rx="12" fill="#FFF2A6"/><text x="600" y="770" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#17324d" text-anchor="middle">¡Usar bien los puntos hace que nuestros textos se entiendan mejor!</text></svg>