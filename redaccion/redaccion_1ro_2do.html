<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargando plataforma…</title><style>body{font-family:system-ui;background:#f7fbfd;color:#25408F;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{font-size:48px}</style></head><body><div class="box"><div class="spin">📚</div><h2>Cargando actividad…</h2></div><script>
(async()=>{try{const p=await fetch('12_payload.b64').then(r=>r.text());const bin=Uint8Array.from(atob(p.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const urls={};for(let i=1;i<=4;i++){const b=await fetch('assets/12_'+i+'.b64').then(r=>r.text());urls['__ASSET_12_'+i+'__']='data:image/webp;base64,'+b.trim();}let html=txt;for(const [k,v] of Object.entries(urls))html=html.split(k).join(v);document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><h2>No se pudo cargar la actividad</h2><p>'+e.message+'</p></div>';}})();
</script></body></html>
